# Market Pulse AI — 이벤트 달력 (GOAL Kickstart 의 '중앙은행 주간' 프레이밍 차용)
#
# 왜 필요한가: 시장 상태 판정의 confidence 에는 "어제도 같은 판정이었다"
# (persistence) 가 들어간다. 그러나 FOMC 하루 전의 지속성은 확신의 근거가
# 못 된다 — 회의 결과 하나로 판정이 통째로 바뀔 수 있다. 같은 이유로
# 이벤트 직전의 가격 급변 알림은 임계를 올려야 잡음이 줄어든다.
#
# 이벤트 창(window) 안에 있으면
#   · confidence 의 persistence 가중 × persistence_scale  (scoring.yaml calendar 절)
#   · 가격·변동성·테마 급변 알림 임계 × alert_threshold_scale
# 판정 자체는 바꾸지 않는다. 확신의 크기와 알림의 민감도만 조정한다.
#
# verified 필드
# -------------
# true  : 1차 출처(각 중앙은행 공표 일정 또는 이번 주 리서치 문서)로 확인한 날짜
# false : 공표된 연간 일정을 옮겨 적은 것으로, 변경 여부를 재확인하지 않았다.
#         화면에 '(미확인)' 으로 표시된다. 불확실한 것을 확정처럼 다루지 않는다.
#
# 날짜는 현지 발표일(YYYY-MM-DD). 시각 비교는 UTC 자정 기준으로 한다 —
# 하루 단위 창이라 시간대 오차는 창 폭에 흡수된다.

