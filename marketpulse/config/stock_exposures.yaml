# 종목의 **사업 구조** 노출 (2026-09-16 신설). 통계 상관과 구분한다.
#
# 통계 노출(rolling beta/corr)은 "지난 60일 같이 움직였는가" 고, 여기 적힌
# 것은 "이 회사의 매출·원가·수요가 실제로 그 변수에 달려 있는가" 다. 둘이
# 다를 때가 정보다 — 원가 노출은 큰데 최근 상관이 없다면 시장이 아직 그
# 변수를 이 종목에 연결하지 않은 것이다.
#
# kind      revenue 매출 / cost 원가 / demand 수요 대리 / financial 금융(환율·금리)
# direction 변수가 오를 때 이익이 가는 방향 (+1 수혜, -1 피해)
# importance high 1.0 / medium 0.6 / low 0.3   (intelligence.yaml)
# rationale 한 줄. 화면에 그대로 나간다.
#
# 이 값들은 사업보고서·상식에 기반한 초기값이지 추정치가 아니다. 틀리면 여기서 고친다.

