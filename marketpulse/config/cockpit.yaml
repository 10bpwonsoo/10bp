#: STOCK RADAR — 종목 선정 점수(합). 단순 수익률 순이 아니다
stock_radar:
  max: 8
  weights: {unusual: 2.0, badge_news: 1.0, badge_eps: 1.5, badge_flow: 1.0, badge_alt: 0.8, badge_theme: 1.0, radar_strongest: 2.0, radar_improving: 1.2, radar_narrative: 1.0, radar_macro: 0.8, relative_strength: 1.0, theme_confirmed: 0.8, driver_impact: 0.8}
  min_score: 1.0

#: LIVE CATALYSTS — 기사 군집(제목 토큰 겹침) + 중요 알림. 중요도 = impact × 확인 가중
catalysts:
  max: 12
  levels: {critical: 65, high: 45}        # impact_score 문턱
  cluster_jaccard: 0.25
  alert_types: [REGIME_CHANGE, PRICE_ZSCORE_SPIKE, DATA_RELEASE]
  alert_min_severity: 45
  confidence_bands: [{min: 0.75, label: HIGH}, {min: 0.5, label: MEDIUM}, {min: 0, label: LOW}]

what_matters_next:
  max: 5
  #: MARKET TRANSMISSION PATH — 이슈를 누르면 Trigger → First-order → Asset → Theme/Industry → Stocks 의 예상 전파와 지금 관측을 나란히 본다.
  #: 정적 매핑을 그대로 확정하지 않는다: 단계마다 현재 z / 상대 z / 테마 점수로 CONFIRMED · PARTIAL · UNCONFIRMED · CONTRADICTED · DATA MISSING 을 붙인다.
  #: 기존 MARKET → STOCK TRANSMISSION 카드는 '지금 일어나는 전파', 여기는 '더 진행되면 번지는 곳'.
  confirm_z: 0.5          # 방향 일치 & |z| ≥ → CONFIRMED
  partial_z: 0.25         # 방향 일치 & |z| ≥ → PARTIAL
  theme_confirm: 20       # 테마 가격 점수(−100~100) 기준
  theme_partial: 8
  tier_max: 5             # 메인에 보이는 tier 당 종목 수 — 나머지는 View all
  #: check = {id: 계열, sign: 기대 부호} · row = {label, kind: instrument|segment|theme, key, sign}
