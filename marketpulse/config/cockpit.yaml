  - {key: CREDIT,     label: "Credit",     group: RISK,      ids: [US_HY_OAS],       expect: {RISK_OFF: 1, LIQUIDITY_STRESS: 1, RISK_ON: -1, GROWTH_SHOCK: 1, INFLATION_SHOCK: 1, GEOPOLITICAL_RISK: 1, POLICY_DRIVEN: 0, NEUTRAL: 0}, invert_arrow: true}
