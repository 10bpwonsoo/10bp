#: CROSS-ASSET CONFIRMATION — 판정 라벨별 기대 방향. 0 이면 기대 없음. mismatch 가 HEADWIND 인 자산은 '반대지만 괴리가 아니라 역풍'
cross_assets:
  - {key: EQUITY,     label: "Equity",     group: RISK,      ids: [SPX, NDX],        expect: {RISK_OFF: -1, LIQUIDITY_STRESS: -1, RISK_ON: 1, GROWTH_SHOCK: -1, INFLATION_SHOCK: -1, GEOPOLITICAL_RISK: -1, POLICY_DRIVEN: 0, NEUTRAL: 0}}
