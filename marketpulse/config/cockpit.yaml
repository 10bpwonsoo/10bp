        themes: [{label: "AI Software", kind: segment, key: software, sign: -1}, {label: "AI Compute", kind: segment, key: compute, sign: -1}, {label: "Data Center REIT / Infra", kind: segment, key: dc_infra, sign: -1}, {label: "Hyperscalers", kind: segment, key: hyperscalers, sign: -1}]
        expect: -1
