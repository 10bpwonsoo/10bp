    SAMSUNG: {drivers: [DRAM_SPOT, KR_FOREIGN_NET, USDKRW], trigger: "메모리 가격 개선과 외국인 수급 반전이 동시에 나타나면 재평가"}
    POSCO: {drivers: [CSI300, STEEL_ETF, USDCNH], trigger: "중국 수요지표 개선 또는 철강가격 반등 시 재평가"}
    HMM: {drivers: [SCFI, CSI300, DRY_BULK_ETF], trigger: "운임지수 방향 전환 시 재평가"}
    HD_HHI: {drivers: [DRY_BULK_ETF, STEEL_ETF, USDKRW], trigger: "건화물 운임 반등 또는 수주 뉴스 확인 시 재평가"}
    KOREAN_AIR: {drivers: [BRENT, USDKRW, JETS], trigger: "브렌트 반등 또는 수요 지표 약화 시 재평가"}
