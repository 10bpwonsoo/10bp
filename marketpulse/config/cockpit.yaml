#: MARKET REGIME HISTORY · 1M — 실시간 2 탭에만 붙는 히스토리 층. 판정 히스토리(같은 엔진 재생)를 다시 계산하지 않고
#: 화면용 Display Regime 으로 안정화한다. Raw State 는 그대로 남긴다(같은 응답의 days[].raw_state / end_regime).
history:
  days: 22
  #: 기간 선택. 1M 은 재생 히스토리로 나온다. 3M/6M 은 저장된 일별 스냅샷이 그만큼 쌓여야 켜진다 — 없으면 만들지 않는다.
  ranges:
    - {key: 1M, days: 22}
    - {key: 3M, days: 63}
    - {key: 6M, days: 126}
  #: Raw StateLabel → 화면 taxonomy. RISK_OFF 는 Liquidity Stress / Risk-Off 로 합친다. 지정학은 따로 둔다(있는 날에만 나타난다).
  taxonomy:
    RISK_ON:          {key: risk_on,          label: "Risk-On"}
    NEUTRAL:          {key: neutral,          label: "Neutral / Mixed"}
    GROWTH_SHOCK:     {key: growth,           label: "Growth"}
    INFLATION_SHOCK:  {key: inflation,        label: "Inflation"}
    POLICY_DRIVEN:    {key: policy,           label: "Policy Driven"}
    LIQUIDITY_STRESS: {key: liquidity_stress, label: "Liquidity Stress / Risk-Off"}
    RISK_OFF:         {key: liquidity_stress, label: "Liquidity Stress / Risk-Off"}
    GEOPOLITICAL_RISK: {key: geopolitical,    label: "Geopolitical"}
  #: Display Regime 안정화. 새 regime 으로 바뀌려면 (a) 연속 min_dwell_days 거래일 같은 raw regime 이거나
  #: (b) 하루라도 확신(evidence strength) ≥ strong_evidence 여야 한다. 그 외의 하루짜리 flip 은 직전 display regime 이 이어진다(bridged).
  #: 장중 관측이 있는 날은 dominant regime(하루 중 가장 오래 유지) 을 raw 로 쓰고, dwell < min_dwell_share 면 확인으로 세지 않는다.
  display:
    min_dwell_days: 2
    strong_evidence: 80
    min_dwell_share: 0.5
  #: OFFICIAL vs RAW 전환 상태 문구 (2026-10-07). {cur}=공식 regime, {raw}=오늘 raw 후보, {n}=raw 지속 일수, {need}=확정에 필요한 연속 일수
  transition:
    confirmed: "raw 신호가 공식 regime {cur}과(와) 같은 방향"
    unconfirmed: "{raw} 신호가 나타났지만 아직 전환 조건 미충족 (raw {n}D / 필요 {need}D)"
    watch: "{raw} 신호 {n}D — 다음 거래일에도 이어지면 공식 regime 이 전환된다 (필요 {need}D)"
    changed: "공식 regime 전환 확정: {prev} → {cur}"   # 영문 라벨 뒤 조사를 정할 수 없어 화살표로 쓴다(2026-10-12)
  #: 공식 regime 판정 상태 문구 (2026-10-22) — MARKET NOW 와 History 가 같은 regime_state 를 쓴다. 일수는 서로 다른 미국 장(Daily Snapshot)만 센다.
  #: {cur}=공식 regime, {raw}=Daily Snapshot raw 신호, {prev}=직전 공식, {n}=raw 연속 일수, {need}=확정에 필요한 일수, {conf}=확신 %, {strong}=강한 증거 문턱
  state_text:
    pending: "{raw} 신호 {n}/{need}일 — 다른 Daily Snapshot 에서 한 번 더 확인되면 공식 regime 전환({cur} → {raw}). 그 전까지 공식은 {cur}"
    confirmed: "공식 regime 전환 확정: {prev} → {cur} ({n}/{need}일 연속)"
    confirmed_strong: "공식 regime 전환 확정: {prev} → {cur} (확신 {conf}% ≥ {strong}% 강한 증거)"
    stable: "{cur} 유지 {n}일째 — Daily Snapshot raw 신호도 같은 방향"
  #: DRIVER HEAT STRIP — 판정 엔진 factor 점수(z 단위) 다섯 개. heat_ref 에서 색이 포화한다. 화살표 문턱은 factor z 기준.
  #: factor 점수의 부호를 그대로 번역하지 않는다 — 각 factor 의 경제적 의미로 현재 상태를 말한다. horizon 은 대표 계열의 1D / 5D z(부호 = factor 방향).
  drivers:
    - {key: RiskAppetite, label: "Risk Appetite",       label_ui: "Risk Appetite",       label_ko: "위험선호",      meaning: {up: "위험선호 강화", down: "위험선호 약화", flat: "위험선호 중립"}, horizon: {id: SPX, sign: 1}, horizon_label: "S&P 500",
       read: {pullback_up: "오늘은 주가가 밀렸지만 최근 5일 위험선호 회복은 유지", pullback_down: "오늘은 반등했지만 최근 5일 위험선호 약화 흐름은 유지"}}
    - {key: Liquidity,    label: "Liquidity",           label_ui: "Liquidity Condition", label_ko: "유동성 환경",    meaning: {up: "유동성 환경 개선", down: "유동성 환경 악화", flat: "유동성 환경 중립"}, horizon: {id: MOVE, sign: -1}, horizon_label: "MOVE(채권 변동성, 역방향)",
       read: {pullback_up: "오늘은 채권 변동성이 올랐지만 최근 5일 유동성 환경은 개선", pullback_down: "오늘은 채권 변동성이 진정됐지만 최근 5일 유동성 악화 흐름은 유지"}}
    - {key: Rates,        label: "Rates",               label_ui: "Rate Pressure",       label_ko: "금리 압력",      meaning: {up: "금리 압력 상승", down: "금리 압력 완화", flat: "금리 압력 중립"}, horizon: {id: US10Y, sign: 1}, horizon_label: "US 10Y",
       read: {pullback_up: "오늘 금리는 하락했지만 최근 5일 장기금리 상승 압력은 유지", pullback_down: "오늘 금리는 올랐지만 최근 5일 장기금리 하락 흐름은 유지"}}
    - {key: Inflation,    label: "Inflation",           label_ui: "Inflation Pressure",  label_ko: "인플레이션 압력", meaning: {up: "물가 압력 상승", down: "물가 압력 완화", flat: "물가 압력 중립"}, horizon: {id: BE10Y, sign: 1}, horizon_label: "US 10Y Breakeven",
       read: {pullback_up: "오늘 기대인플레이션은 내렸지만 최근 5일 물가 압력은 유지", pullback_down: "오늘 기대인플레이션은 올랐지만 최근 5일 물가 압력 완화는 유지"}}
    - {key: Credit,       label: "Credit",              label_ui: "Credit Stress",       label_ko: "신용 스트레스",   meaning: {up: "신용 스트레스 확대", down: "신용 스트레스 완화", flat: "신용 스트레스 중립"}, horizon: {id: US_HY_OAS, sign: 1}, horizon_label: "US HY OAS",
       read: {pullback_up: "오늘 스프레드는 좁혀졌지만 최근 5일 신용 스트레스 확대는 유지", pullback_down: "오늘 스프레드는 벌어졌지만 최근 5일 신용 스트레스 완화는 유지"}}
  heat_legend: {color: "COLOR = factor 방향 (빨강 +, 파랑 −) — 좋고 나쁨이 아니다", arrow: "ARROW = 현재 경제적 의미 (오른쪽 한글)"}
  heat_ref: 2.0
  heat_arrow: [1.5, 0.5]
  #: 전환의 primary driver — 도착 regime 과 결이 맞는 factor 중 변화가 가장 큰 것. Neutral 로의 전환은 떠난 regime 의 factor 가 풀린 것.
  regime_factors:
    liquidity_stress: [Liquidity, Credit]
    risk_on: [RiskAppetite, Credit]
    policy: [Rates]
    inflation: [Inflation, Rates]
    growth: [RiskAppetite]
    geopolitical: [RiskAppetite]
  primary_min_change: 0.5
  composite_slope_days: 5
  transitions_max: 3
  top_evidence: 2

# ── MARKET TONE SNAPSHOT (2026-10-07) — 실시간 2 의 MARKET REGIME HISTORY 와 TODAY'S MARKET DRIVERS 사이 ──
# 실시간 탭의 온도계(snapshot.thermometer) 를 그대로 쓴다 — 다시 계산하지 않는다. 여기 있는 것은 상태 taxonomy·의미·문장 템플릿뿐이다.
# 모든 값은 온도계와 같은 눈금(-100~+100, 뜨거운=위험선호 쪽이 +). 확률 표현 없음.
tone:
  subtitle: "현재 시장의 가격·위험선호·변동성·신용·성장 신호"
  states:                                   # composite → MARKET TONE 상태 (위에서부터 첫 min 이상)
    - {min: 50,   key: STRONG_RISK_ON,  label: "STRONG RISK-ON",  ko: "강한 위험선호", dir: 1}
    - {min: 20,   key: RISK_ON,         label: "RISK-ON",         ko: "위험선호",      dir: 1}
    - {min: -20,  key: NEUTRAL,         label: "NEUTRAL",         ko: "중립",          dir: 0}
    - {min: -50,  key: RISK_OFF,        label: "RISK-OFF",        ko: "위험회피",      dir: -1}
    - {min: -101, key: STRONG_RISK_OFF, label: "STRONG RISK-OFF", ko: "강한 위험회피", dir: -1}
  component_bands: {strong: 30, mild: 10}   # |값| ≥ strong → up/down · ≥ mild → mild_up/mild_down · 그 아래 flat
  state_words: {up: SUPPORT, mild_up: "NEUTRAL+", flat: NEUTRAL, mild_down: "NEUTRAL−", down: PRESSURE, missing: "DATA MISSING"}
  components:                                # key = 온도계 재료 키. 의미는 '뜨거운 쪽 +' 눈금 기준의 경제적 뜻
    RiskAppetite: {label: "Risk Appetite", ko: "위험선호", up: "위험선호 강화", mild_up: "위험선호 완만한 회복", flat: "위험선호 중립권", mild_down: "위험선호 소폭 약화", down: "위험선호 약화"}
    Volatility:   {label: "Volatility",    ko: "변동성",   up: "변동성 진정(위험선호 지지)", mild_up: "변동성 완만한 진정", flat: "변동성 중립권", mild_down: "변동성 압력 소폭 확대", down: "변동성 압력 확대"}
    Growth:       {label: "Growth",        ko: "성장",     up: "성장 신호 긍정", mild_up: "성장 신호 중립권 상단", flat: "성장 신호 중립권", mild_down: "성장 신호 중립권 하단", down: "성장 둔화 신호"}
    Credit:       {label: "Credit",        ko: "신용",     up: "신용 환경 개선", mild_up: "신용 환경 완만한 개선", flat: "신용 환경 중립권", mild_down: "신용 환경 소폭 부담", down: "신용 환경 부담"}
    KoreaFlow:    {label: "Korea Flow",    ko: "국내 수급", up: "국내 수급 유입", mild_up: "국내 수급 완만한 유입", flat: "국내 수급 중립", mild_down: "국내 수급 소폭 이탈", down: "국내 수급 이탈"}
    news:         {label: "News Sentiment", ko: "뉴스 감성", up: "뉴스 흐름 긍정", mild_up: "뉴스 흐름 다소 긍정", flat: "뉴스 흐름 사실상 중립", mild_down: "뉴스 흐름 다소 부정", down: "뉴스 흐름 부정"}
  missing_meaning: "데이터 없음 — 0 으로 채우지 않았다"
  price_read: {up: "가격이 뚜렷한 위험선호를 말한다", mild_up: "가격은 중립보다 다소 긍정적", flat: "가격은 사실상 중립", mild_down: "가격은 중립보다 다소 부정적", down: "가격이 뚜렷한 위험회피를 말한다", missing: "가격 온도 없음"}
  news_read:  {up: "뉴스 흐름이 뚜렷하게 긍정적", mild_up: "뉴스 흐름은 다소 긍정적", flat: "뉴스 흐름은 사실상 중립", mild_down: "뉴스 흐름은 다소 부정적", down: "뉴스 흐름이 뚜렷하게 부정적", missing: "뉴스 온도 없음(기사 부족)"}
  gap:
    threshold: 10                            # |price − news| 가 이 이상이면 한쪽이 앞선다
    price_lead_up:   {label: "PRICE > NEWS", read: "가격이 뉴스보다 먼저 회복 중"}
    price_lead_down: {label: "PRICE < NEWS", read: "가격이 뉴스보다 먼저 약해지는 중"}
    news_lead_up:    {label: "NEWS > PRICE", read: "뉴스 개선에 비해 가격 확인이 부족"}
    news_lead_down:  {label: "NEWS < PRICE", read: "뉴스 악화에 비해 가격은 아직 버팀"}
    aligned:         {label: "ALIGNED",      read: "가격과 뉴스가 같은 방향"}
    missing:         {label: "—",            read: "가격·뉴스 비교 불가"}
  change:                                   # composite 1W 변화 읽기
    fast: 20
    small: 8
    fast_up: "지난주 {from}에서 {to}으로 빠르게 회복"
    fast_up_same: "지난주보다 톤이 빠르게 회복, {to} 유지"
    fast_down_same: "지난주보다 톤이 빠르게 악화, {to} 유지"
    up: "지난주보다 톤 개선, {to} 유지"
    flat: "지난주와 비슷한 {to} 톤 유지"
    down: "지난주보다 톤 악화, {to}으로"
    fast_down: "지난주 {from}에서 {to}으로 빠르게 악화"
    none: "1주 전 비교 자료 없음"
    #: composite 의 1주 전 — 온도계에 저장 스냅샷 기준 값이 있으면 그것, 없으면 저장된 daily snapshot sequence(위 REGIME HISTORY 와 같은 source)의 5거래일 전 composite
    basis_thermometer: "온도계 1주 전(저장 스냅샷)"
    basis_history: "저장된 daily snapshot 5거래일 전"
    cross_up: "지난주 {from}에서 {to}으로 전환"
    cross_down: "지난주 {from}에서 {to}으로 후퇴"
  changed: {max: 3, min_abs: 10, up: "회복", up_strong: "강한 회복", down: "악화", down_strong: "압력 확대", flip_up: "부담 → 지지로 전환", flip_down: "지지 → 부담으로 전환"}
  confirmation:                             # regime(taxonomy key) 이 기대하는 tone 방향 (+1 · 0 · −1)
    expected: {risk_on: 1, growth: -1, inflation: -1, liquidity_stress: -1, geopolitical: -1, policy: 0, neutral: 0}
    confirmed: "Regime은 {regime}, 현재 시장 tone도 {tone_ko}권으로 일치."
    partial_regime_ahead: "Regime은 {regime}이지만 단기 market tone은 아직 완전히 확인하지 못함."
    partial_tone_ahead: "Regime은 {regime}이지만 단기 market tone은 이미 {tone_ko} 쪽으로 기울어 있음."
    diverging: "Regime은 {regime}, 현재 market tone은 {tone_ko} — 판정과 반대 방향."
    unknown: "tone 을 잴 수 없어 확인 불가."
  read:                                     # MARKET TONE READ — 최대 2문장. 숫자를 다시 읽지 않는다
    support_pressure_neutral: "{support}은(는) {changed_support}, {pressure}이(가) 아직 완전한 Risk-On 전환을 제한하고 있습니다."
    support_only_neutral: "{support}은(는) {changed_support} 나머지 신호는 중립권에 머물러 있습니다."
    pressure_only_neutral: "{pressure}이(가) 부담으로 작용하고 있지만 나머지 신호는 아직 중립권을 지키고 있습니다."
    none_neutral: "어느 신호도 뚜렷한 방향을 내지 않는 중립 구간입니다."
    risk_on: "{support}이(가) 시장을 위험선호 쪽으로 끌고 있고{pressure_tail}."
    risk_on_pressure_tail: ", {pressure}만 부담으로 남아 있습니다"
    risk_on_no_pressure_tail: " 뚜렷한 부담 요인은 없습니다"
    risk_off: "{pressure}이(가) 시장을 위험회피로 누르고 있고{support_tail}."
    risk_off_support_tail: ", {support}만 버티고 있습니다"
    risk_off_no_support_tail: " 버티는 신호가 없습니다"
    changed_up: "지난주 대비 회복했지만"
    changed_flat: "긍정적이지만"
    changed_down: "지난주보다 약해졌고"
    second_neutral_up: "현재는 공격적인 Risk-On보다 중립에서 회복을 확인하는 단계에 가깝습니다."
    second_neutral_down: "현재는 위험회피로 기우는 초기 단계로, 추가 악화 여부를 확인하는 구간입니다."
    second_neutral_flat: "현재는 방향이 정해지지 않은 중립 구간으로, 어느 쪽 신호가 먼저 굳어지는지가 관건입니다."
    second_risk_on_up: "지난주보다 톤이 개선돼 위험선호가 굳어지는 단계입니다."
    second_risk_on_down: "다만 지난주보다 톤이 식어 위험선호의 강도는 확인이 더 필요합니다."
    second_risk_on_flat: "위험선호 톤이 유지되고 있어 추세 지속 여부가 관건입니다."
    second_risk_off_up: "지난주보다는 완화됐지만 아직 위험회피 구간을 벗어나지 못했습니다."
    second_risk_off_down: "지난주보다 톤이 더 악화돼 위험회피가 깊어지는 단계입니다."
    second_risk_off_flat: "위험회피 톤이 이어지고 있어 완화 신호가 먼저 나와야 합니다."
