    pullback_down: "오늘은 반등했지만 최근 5일 하락 흐름은 유지"
    turn_up: "최근 5일은 약했지만 오늘 반등"
    turn_down: "최근 5일은 강했지만 오늘 조정"
    flat: "단기·5일 모두 움직임이 작음"
  #: 전파 단계의 일반 설명(영어 단계명 옆 한글). 경로별 *_explain 이 있으면 그것을 쓴다.
  stage_explain:
    trigger: "판단을 바꿀 수 있는 변수의 변화"
    first_order: "그 변화가 다음 시장 변수로 옮겨가는 경로"
    assets: "영향을 받는 자산군 — 지금 실제로 그렇게 움직이는지"
    themes: "영향이 집중되는 산업·테마"
    stocks: "실제 종목에서 해당 영향이 나타나는지 확인"
  #: 메인에 보이는 tier 당 종목 수. TERTIARY 0 = 기본 접기. 우선순위: radar 종목 → |z| 큰 종목 → 확인이 뚜렷한 종목 → 중요한 contradiction.
  tier_show: {DIRECT: 4, SECONDARY: 3, TERTIARY: 0}

#: STOCK RADAR · ANALYST VIEW — 외부 애널리스트 코멘트. 시스템 판단과 섞지 않는다. 웹에서 이름·증권사·날짜·URL·맥락이 모두 확인된 것만 싣고
