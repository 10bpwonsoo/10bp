#: clauses 는 [양수 z 문장, 음수 z 문장]. 문장 = "A·B에 C까지 {tail}" / "A·B가 {tail}"
#: MARKET NOW 의 MARKET READ (2026-10-07) — 공식 regime 과 raw 신호의 관계. 숫자를 다시 읽지 않는다
now_read:
  confirmed: "{official}은(는) 유지되고 있고 Daily Snapshot 신호도 같은 방향입니다."
  unconfirmed: "{official}은(는) 유지되고 있지만 현재 raw signal 은 {raw} 방향으로 약화되고 있습니다. 추가 확인 시 regime 전환 가능성이 있습니다."
  watch: "공식 regime 은 {official}입니다. Daily Snapshot 신호는 {raw} — {n}/{need}일 확인으로, 다른 Daily Snapshot 에서 한 번 더 확인되면 공식 regime 이 전환됩니다."
  changed: "공식 regime 이 전환됐습니다: {prev} → {official}. Daily Snapshot 신호가 전환 조건을 충족했습니다."   # 영문 라벨 뒤 조사를 정할 수 없어 화살표로 쓴다(2026-10-12)
  no_history: "저장된 판정 sequence 가 없어 오늘 raw 판정을 그대로 공식 regime 으로 씁니다."
  live: "장중 신호는 {live} — 공식 연속일수에는 넣지 않습니다."
conviction_trend: {delta: 10}

regime_tail:
  LIQUIDITY_STRESS: "겹친 유동성 경색 · broad risk-off 환경이다."
  RISK_OFF: "겹친 위험회피 환경이다."
  RISK_ON: "이어지는 위험선호 환경이다."
  INFLATION_SHOCK: "겹친 물가 충격 환경이다."
  GROWTH_SHOCK: "겹친 성장 충격 환경이다."
  POLICY_DRIVEN: "겹친 정책 주도 환경이다."
  GEOPOLITICAL_RISK: "겹친 지정학 위험 환경이다."
  NEUTRAL: "있지만 어느 판정 룰도 걸리지 않은 혼조 환경이다."

