# 실시간 메인 탭 — decision cockpit. 기존 층(판정·테마·괴리·뉴스·Investment·AI/금리/유가 판별)을 다시 계산하지 않고
# 우선순위만 매겨 고른다: REGIME → DRIVERS → CONFIRMATION → LEADERSHIP → TRANSMISSION → CATALYSTS → RISKS / WATCH.
# 모든 문턱·가중·문장은 여기 있다. 확률이 아니라 증거 크기. 없는 데이터는 만들지 않는다 — 카드가 비면 숨긴다.

z_ref: 2.0
conviction_bands: [{min: 60, label: HIGH}, {min: 40, label: MEDIUM}, {min: 0, label: LOW}]
key_variables_max: 4
flat_abs: 0.5                       # |z| 가 이 아래면 방향 없음
arrow: [2.0, 0.8]                   # ↑↑ ≥ 2.0σ, ↑ ≥ 0.8σ

#: 한 문장 시장 설명 — 핵심 변수의 방향 절 + 판정 꼬리. 절은 |z| 큰 순서로 최대 3개.
clauses:
  US_HY_OAS: ["신용스프레드 확대", "신용스프레드 축소"]
  VIX: ["변동성 상승", "변동성 하락"]
  MOVE: ["채권 변동성 상승", "채권 변동성 진정"]
  SPX: ["미국 주식 강세", "미국 주식 약세"]
  NDX: ["나스닥 강세", "나스닥 약세"]
  KOSPI: ["코스피 강세", "코스피 약세"]
  US10Y: ["장기금리 상승", "장기금리 하락"]
  US2Y: ["단기금리 상승", "단기금리 하락"]
  DXY: ["달러 강세", "달러 약세"]
  USDKRW: ["원화 약세", "원화 강세"]
  GOLD: ["금 상승", "금 급락"]
  BRENT: ["유가 상승", "유가 하락"]
  WTI: ["유가 상승", "유가 하락"]
  COPPER: ["구리 상승", "구리 하락"]
#: clauses 는 [양수 z 문장, 음수 z 문장]. 문장 = "A·B에 C까지 {tail}" / "A·B가 {tail}"
regime_tail:
  LIQUIDITY_STRESS: "겹친 유동성 경색 · broad risk-off 환경이다."
  RISK_OFF: "겹친 위험회피 환경이다."
  RISK_ON: "이어지는 위험선호 환경이다."
  INFLATION_SHOCK: "겹친 물가 충격 환경이다."
  GROWTH_SHOCK: "겹친 성장 충격 환경이다."
  POLICY_DRIVEN: "겹친 정책 주도 환경이다."
  GEOPOLITICAL_RISK: "겹친 지정학 위험 환경이다."
  NEUTRAL: "있지만 어느 판정 룰도 걸리지 않은 혼조 환경이다."

#: TODAY'S MARKET DRIVERS 후보 — 증거표(부호·가중)로 강도, 확인·지속·뉴스로 중요도를 매긴다. 상위 max 개.
drivers:
  max: 5
  min_strength: 0.25
  min_coverage: 0.5
  weights: {strength: 1.0, coverage: 0.4, confirmation: 0.15, persistence: 0.10, news: 0.15}   # 합 × impact(시장 영향도, 후보별)
  news_ref: 40
  candidates:
    credit_stress:
      impact: 1.0
      label: "CREDIT STRESS"
      label_ko: "신용 스트레스"
      evidence: [{id: US_HY_OAS, sign: 1, weight: 1.5}, {id: VIX, sign: 1, weight: 1.0}, {id: SPX, sign: -1, weight: 1.0}]
      why: {up: "주식 약세가 단순 차익실현이 아니라 금융여건 악화와 동반되고 있다.", down: "신용여건 완화가 위험자산을 지지한다."}
      next: {up: "HY OAS 가 추가 확대되는가", down: "HY OAS 축소가 이어지는가"}
    volatility_regime:
      impact: 0.85
      label: "VOLATILITY"
      label_ko: "변동성"
      evidence: [{id: VIX, sign: 1, weight: 1.0}, {id: MOVE, sign: 1, weight: 1.0}, {id: VIX_RV_SPX, sign: 1, weight: 0.5}]
      why: {up: "주식·채권 변동성이 같이 오른다 — 포지션 축소 압력이 자산군을 넘어 번진다.", down: "변동성이 가라앉으며 위험 감수 여력이 회복된다."}
      next: {up: "VIX·MOVE 상승이 이어지는가", down: "변동성 진정이 유지되는가"}
    equity_beta:
      impact: 0.9
      label: "EQUITY DIRECTION"
      label_ko: "주식 방향"
      evidence: [{id: SPX, sign: 1, weight: 1.0}, {id: NDX, sign: 1, weight: 0.8}, {id: RUT, sign: 1, weight: 0.6}, {id: KOSPI, sign: 1, weight: 0.8}]
      theme: null
      why: {up: "지수가 넓게 오른다 — 위험선호가 주식으로 들어온다.", down: "미국·한국 지수가 같이 밀린다 — 개별 요인이 아니라 베타다."}
      next: {up: "지수 상승이 breadth 를 동반하는가", down: "지수 하락이 확산되는가"}
    long_end_rates:
      impact: 1.0
      label: "LONG-END RATES"
      label_ko: "장기금리"
      evidence: [{id: US10Y, sign: 1, weight: 1.0}, {id: US30Y, sign: 1, weight: 1.0}, {id: TIPS10Y, sign: 1, weight: 0.8}]
      context: [BE10Y]
      theme: rates
      why: {up: "인플레이션 기대보다 real yield / term-premium 성격의 금리 상승에 가깝다.", down: "장기금리 하락이 듀레이션 자산을 지지한다."}
      why_be_up: {up: "기대인플레이션이 같이 올라 물가 리프라이싱 성격의 금리 상승이다."}
      next: {up: "US 10Y 가 고점을 갱신하는가", down: "장기금리 하락이 이어지는가"}
    fed_path:
      impact: 0.7
      label: "FED PATH / FRONT END"
      label_ko: "연준 경로·단기금리"
      evidence: [{id: US2Y, sign: 1, weight: 1.0}, {id: CURVE_2S10S, sign: -1, weight: 0.8}]
      theme: rates
      why: {up: "단기금리가 오르며 인하 기대가 밀린다.", down: "단기금리 하락 — 시장이 완화 경로를 당겨 잡는다. 장기물과 갈리면 커브 스티프닝이다."}
      next: {up: "2년물 상승이 이어지는가", down: "2년물 하락(완화 기대)이 유지되는가"}
    usd:
      impact: 0.8
      label: "US DOLLAR"
      label_ko: "달러"
      evidence: [{id: DXY, sign: 1, weight: 1.0}, {id: USDKRW, sign: 1, weight: 0.8}, {id: USDJPY, sign: 1, weight: 0.5}]
      theme: usd
      why: {up: "달러 강세 — 글로벌 위험자산과 원화 자산에 역풍.", down: "달러 약세 — 신흥국·원화 자산에 순풍."}
      next: {up: "달러 강세가 원달러로 전이되는가", down: "달러 약세가 이어지는가"}
    oil:
      impact: 0.8
      label: "OIL"
      label_ko: "유가"
      evidence: [{id: BRENT, sign: 1, weight: 1.0}, {id: WTI, sign: 1, weight: 0.8}, {id: XLE, sign: 1, weight: 0.5}]
      theme: oil
      why: {up: "유가 상승이 물가 기대와 에너지 주식으로 번진다.", down: "유가 하락 — 항공·운송에 순풍, 에너지·정유에 역풍. 기대인플레이션 전이는 따로 본다."}
      next: {up: "유가 상승이 기대인플레이션으로 전달되는가", down: "유가 하락이 기대인플레이션으로 전달되는가"}
    gold_real:
      impact: 0.6
      label: "GOLD / REAL RATES"
      label_ko: "금·실질금리"
      evidence: [{id: GOLD, sign: -1, weight: 1.0}, {id: TIPS10Y, sign: 1, weight: 1.0}]
      why: {up: "실질금리 상승이 금을 누른다 — 안전자산이 아니라 디레버리징 매도.", down: "실질금리 하락과 금 강세 — 안전자산 수요."}
      next: {up: "금 급락이 실질금리 상승과 함께 이어지는가", down: "금 강세가 유지되는가"}
    ai_semi_relative:
      impact: 0.75
      label: "AI / SEMI RELATIVE"
      label_ko: "AI·반도체 상대강도"
      evidence: [{id: AI_REL_NDX, sign: 1, weight: 1.2}, {id: SOXX, sign: 1, weight: 0.8}, {id: AI_EQUIPMENT_REL, sign: 1, weight: 0.8}]
      theme: ai
      label_resilient: "AI / SEMI RELATIVE RESILIENCE"
      why: {up: "시장 Risk-Off 에도 AI infrastructure 일부(장비·패키징)는 상대강도를 유지한다.", down: "AI 가 시장보다 더 빠진다 — 베타가 아니라 AI 고유 요인을 의심한다."}
      next: {up: "AI/Semi 상대강도가 유지되는가", down: "AI 상대 약세가 −1σ 아래로 깊어지는가"}
    korea:
      impact: 0.75
      label: "KOREA"
      label_ko: "한국 시장"
      evidence: [{id: KOSPI, sign: 1, weight: 1.0}, {id: KOSDAQ, sign: 1, weight: 0.6}, {id: USDKRW, sign: -1, weight: 0.6}, {id: KR_FOREIGN_NET, sign: 1, weight: 0.8}]
      theme: korea_governance
      why: {up: "국내 지수·원화가 같이 강하다.", down: "국내 지수 약세 — 외국인 매도와 원화 약세가 겹치면 자금 이탈 성격이다."}
      next: {up: "외국인 매수 전환이 이어지는가", down: "외국인 한국 주식 매도가 지속되는가"}
    china:
      impact: 0.6
      label: "CHINA"
      label_ko: "중국"
      evidence: [{id: HSCEI, sign: 1, weight: 1.0}, {id: COPPER, sign: 1, weight: 0.7}, {id: USDCNH, sign: -1, weight: 0.5}]
      theme: china
      why: {up: "중국 주식·구리가 같이 오른다 — 중국 수요 기대.", down: "중국 주식·구리 약세 — 중국 수요 우려가 원자재로 번진다."}
      next: {up: "중국 수요 기대가 구리에서 확인되는가", down: "중국 약세가 원자재로 더 번지는가"}
  #: 대체데이터는 |z| 가 클 때만 driver 로 등장한다 (Investment 층의 commodity_impact / alternative 에서)
  alt:
    min_z: 1.2
    max: 2
    labels:
      DRY_BULK_ETF: {label: "SHIPPING DEMAND", why: {up: "건화물 운임 상승 — 벌크 해운 매출 순풍.", down: "건화물 운임 약세 — 해운 수요 둔화."}}
      ALUMINUM: {label: "ALUMINUM", why: {up: "알루미늄 상승 — 자동차·산업재 원가 압박.", down: "알루미늄 하락 — 자동차·산업재 원가 완화."}}
      COPPER: {label: "COPPER", why: {up: "구리 상승 — 산업 수요·전력 인프라 기대.", down: "구리 하락 — 산업 수요 둔화 신호."}}
      NATGAS: {label: "NATURAL GAS", why: {up: "천연가스 상승 — 유틸리티·화학 원가.", down: "천연가스 하락 — 발전·화학 원가 완화."}}
      DRAM_SPOT: {label: "MEMORY PRICING", why: {up: "DRAM 현물 상승 — 메모리 이익 방향 개선.", down: "DRAM 현물 하락 — 메모리 이익 방향 악화."}}
      LITHIUM_ETF: {label: "LITHIUM", why: {up: "리튬 반등 — 배터리 체인 원가·심리.", down: "리튬 약세 — 배터리 체인 부담."}}

#: CROSS-ASSET CONFIRMATION — 판정 라벨별 기대 방향. 0 이면 기대 없음. mismatch 가 HEADWIND 인 자산은 '반대지만 괴리가 아니라 역풍'
cross_assets:
  - {key: EQUITY,     label: "Equity",     ids: [SPX, NDX],        expect: {RISK_OFF: -1, LIQUIDITY_STRESS: -1, RISK_ON: 1, GROWTH_SHOCK: -1, INFLATION_SHOCK: -1, GEOPOLITICAL_RISK: -1, POLICY_DRIVEN: 0, NEUTRAL: 0}}
  - {key: RATES,      label: "Rates",      ids: [US10Y],           expect: {RISK_OFF: -1, LIQUIDITY_STRESS: -1, RISK_ON: 1, GROWTH_SHOCK: -1, INFLATION_SHOCK: 1, GEOPOLITICAL_RISK: -1, POLICY_DRIVEN: 0, NEUTRAL: 0}, mismatch: HEADWIND}
  - {key: CREDIT,     label: "Credit",     ids: [US_HY_OAS],       expect: {RISK_OFF: 1, LIQUIDITY_STRESS: 1, RISK_ON: -1, GROWTH_SHOCK: 1, INFLATION_SHOCK: 1, GEOPOLITICAL_RISK: 1, POLICY_DRIVEN: 0, NEUTRAL: 0}, invert_arrow: true}
  - {key: VOLATILITY, label: "Volatility", ids: [VIX, MOVE],       expect: {RISK_OFF: 1, LIQUIDITY_STRESS: 1, RISK_ON: -1, GROWTH_SHOCK: 1, INFLATION_SHOCK: 1, GEOPOLITICAL_RISK: 1, POLICY_DRIVEN: 1, NEUTRAL: 0}}
  - {key: USD,        label: "USD",        ids: [DXY],             expect: {RISK_OFF: 1, LIQUIDITY_STRESS: 1, RISK_ON: -1, GROWTH_SHOCK: 1, INFLATION_SHOCK: 1, GEOPOLITICAL_RISK: 1, POLICY_DRIVEN: 0, NEUTRAL: 0}}
  - {key: OIL,        label: "Oil",        ids: [BRENT, WTI],      expect: {RISK_OFF: -1, LIQUIDITY_STRESS: -1, RISK_ON: 1, GROWTH_SHOCK: -1, INFLATION_SHOCK: 1, GEOPOLITICAL_RISK: 1, POLICY_DRIVEN: 0, NEUTRAL: 0}}
  - {key: GOLD,       label: "Gold",       ids: [GOLD],            expect: {RISK_OFF: 1, LIQUIDITY_STRESS: 1, RISK_ON: -1, GROWTH_SHOCK: 1, INFLATION_SHOCK: 1, GEOPOLITICAL_RISK: 1, POLICY_DRIVEN: 0, NEUTRAL: 0}}
key_divergences_max: 2

#: MARKET LEADERSHIP — 테마(themes.yaml 구성 자산) + 섹터 ETF. 1D z · 1주 상대(z_5d − 벤치마크 z_5d) · breadth(20일선 위 비율)
leadership:
  benchmark: SPX
  sectors: [XLK, XLE, XLF, XLU, XLY, SOXX, ITA, JETS]
  sector_dedupe: {SOXX: semiconductor, ITA: defense, XLE: energy}   # 같은 것을 재는 테마가 있으면 섹터 줄은 뺀다
  equity_only: true                                                   # 가격 리더십은 주식 계열로만 잰다(금리·원자재 테마 제외)
  leaders_max: 4
  laggards_max: 3
  min_rel: 0.3
  exclude_themes: [korea_governance, shareholder_return, rates, inflation, usd]   # 수급·지배구조·금리·물가·환율 테마는 주식 리더십이 아니다
theme_pulse:
  max: 6
  price_ref: 30     # price_momentum(−100~100) → ↑ ≥ 15, ↑↑ ≥ 45
  news_ref: 30

#: MARKET → STOCK TRANSMISSION — driver 별 경로. stocks 는 AI universe(ai_regime.yaml) 또는 국내 universe id
transmission:
  max_stocks: 5
  chains:
    long_end_rates:  {up: {mechanism: "Long-duration pressure", industries: ["Software / Growth", "REIT / 데이터센터 인프라"], stocks: [PLTR, NOW, SNOW, DLR, EQIX], expect: -1}, down: {mechanism: "Duration relief", industries: ["Software / Growth"], stocks: [PLTR, NOW, SNOW], expect: 1}}
    credit_stress:   {up: {mechanism: "Risk premium ↑", industries: ["Small-cap / High beta", "국내 고베타"], stocks: [SMCI, APP, SNDK, HANMI_SEMI, KOREAN_AIR], expect: -1}, down: {mechanism: "Risk premium ↓", industries: ["High beta"], stocks: [SMCI, APP, HANMI_SEMI], expect: 1}}
    ai_semi_relative: {up: {mechanism: "AI infrastructure 상대강도", industries: ["Equipment / Packaging", "Compute / Networking"], stocks: [LRCX, AMAT, TEL, HANMI_SEMI, NVDA, ANET], expect: 1}, down: {mechanism: "AI beta 이탈", industries: ["Compute / Hyperscalers"], stocks: [NVDA, AVGO, MSFT, AMZN], expect: -1}}
    usd:             {up: {mechanism: "달러 강세 → 원화 자산 역풍", industries: ["국내 수출·반도체(환율 민감)"], stocks: [SAMSUNG, SKHYNIX, HYUNDAI_MOTOR], expect: -1}, down: {mechanism: "달러 약세 → 신흥국 순풍", industries: ["국내 대형주"], stocks: [SAMSUNG, SKHYNIX], expect: 1}}
    oil:             {up: {mechanism: "유가 상승 → 정유 + / 항공 −", industries: ["정유·에너지 +", "항공 −"], stocks: [SOIL, SK_INNOVATION, KOREAN_AIR], expect: 1}, down: {mechanism: "유가 하락 → 항공 + / 정유 −", industries: ["항공 +", "정유·에너지 −"], stocks: [KOREAN_AIR, SOIL, SK_INNOVATION], expect: -1}}
    gold_real:       {up: {mechanism: "실질금리 ↑ → 금·고밸류 성장주 부담", industries: ["금 관련", "고듀레이션 성장주"], stocks: [KOREA_ZINC, PLTR, NOW], expect: -1}, down: {mechanism: "실질금리 ↓ → 금·성장주 순풍", industries: ["금 관련"], stocks: [KOREA_ZINC], expect: 1}}
    korea:           {up: {mechanism: "국내 위험선호 회복", industries: ["반도체 대형주", "지수 고베타"], stocks: [SAMSUNG, SKHYNIX, HANMI_SEMI], expect: 1}, down: {mechanism: "외국인 매도 · 원화 약세", industries: ["반도체 대형주", "지수 고베타"], stocks: [SAMSUNG, SKHYNIX, NAVER], expect: -1}}
    china:           {up: {mechanism: "중국 수요 기대", industries: ["화학·철강·해운"], stocks: [POSCO, LGCHEM, PAN_OCEAN], expect: 1}, down: {mechanism: "중국 수요 우려", industries: ["화학·철강·해운"], stocks: [POSCO, LGCHEM, LOTTE_CHEM, PAN_OCEAN], expect: -1}}
    volatility_regime: {up: {mechanism: "변동성 ↑ → 고베타·레버리지 축소", industries: ["고베타 반도체·소프트웨어"], stocks: [SMCI, APP, HANMI_SEMI], expect: -1}, down: {mechanism: "변동성 ↓ → 위험 감수 회복", industries: ["고베타"], stocks: [SMCI, APP], expect: 1}}
    equity_beta:     {up: {mechanism: "지수 베타", industries: ["대형주"], stocks: [SAMSUNG, SKHYNIX, NVDA, MSFT], expect: 1}, down: {mechanism: "지수 베타", industries: ["대형주"], stocks: [SAMSUNG, SKHYNIX, NVDA, MSFT], expect: -1}}
    fed_path:        {up: {mechanism: "인하 기대 후퇴 → 금융주 +, 성장주 −", industries: ["은행 +", "성장주 −"], stocks: [KB, SHINHAN, PLTR], expect: 0}, down: {mechanism: "완화 기대 → 성장주 +, 은행 마진 −", industries: ["성장주 +", "은행 −"], stocks: [PLTR, NOW, KB, SHINHAN], expect: 0}}
  confirm_z: 0.3      # 종목 z(또는 시장 축) 가 기대 방향으로 이 이상이면 CONFIRMED, 반대면 CONTRADICTED

#: STOCK RADAR — 종목 선정 점수(합). 단순 수익률 순이 아니다
stock_radar:
  max: 8
  weights: {unusual: 2.0, badge_news: 1.0, badge_eps: 1.5, badge_flow: 1.0, badge_alt: 0.8, badge_theme: 1.0, radar_strongest: 2.0, radar_improving: 1.2, radar_narrative: 1.0, radar_macro: 0.8, relative_strength: 1.0, theme_confirmed: 0.8, driver_impact: 0.8}
  min_score: 1.0

#: LIVE CATALYSTS — 기사 군집(제목 토큰 겹침) + 중요 알림. 중요도 = impact × 확인 가중
catalysts:
  max: 12
  levels: {critical: 65, high: 45}        # impact_score 문턱
  cluster_jaccard: 0.25
  alert_types: [REGIME_CHANGE, PRICE_ZSCORE_SPIKE, DATA_RELEASE]
  alert_min_severity: 45
  confidence_bands: [{min: 0.75, label: HIGH}, {min: 0.5, label: MEDIUM}, {min: 0, label: LOW}]

what_matters_next:
  max: 5
watchlist_max: 5
data_status:
  important: [SPX, NDX, US10Y, US_HY_OAS, VIX, KOSPI, BRENT, DXY]
  stale_warn_days: 3
