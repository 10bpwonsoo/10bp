# Daily snapshot history (2026-10-07).
#
# History 는 "오늘의 모델이 과거를 다시 평가한 화면" 이 아니라 "각 날짜의 시스템 판단을 한 번 저장한 뒤 고정한 기록" 이다.
#   PAST + SNAPSHOT EXISTS  → 그대로 읽는다 (LOCKED)
#   PAST + SNAPSHOT MISSING → 그 날짜까지의 데이터와 현재 모델로 1회 계산 → BACKFILLED 저장 → 즉시 LOCKED
#   TODAY                   → LIVE (장중 재계산 가능) → Daily Finalization 뒤 RECORDED → LOCKED
# 모델·룰이 바뀌어도, 데이터가 수정돼도 과거 snapshot 은 바뀌지 않는다. 현재 모델로 과거를 다시 보는 것은 별도의 RECOMPUTED HISTORY 다.
window_days: 22            # 1M history window (거래일)
backfill_days: 22          # 처음 켤 때 / 매일 채우는 과거 날짜 수 (snapshot 이 없는 날만)
finalize_time: "16:10"     # Daily Finalization 시각 (KST). 이 시각 이후 계산된 오늘 값이 RECORDED 가 된다
timezone: "Asia/Seoul"
weekdays_only: true        # 토·일 날짜의 snapshot 은 새로 만들지 않는다(기록·backfill 모두). 이미 있는 주말 snapshot 은 지우거나 바꾸지 않는다
ranges:
  - {key: 1M, days: 22}
  - {key: 3M, days: 63}
  - {key: 6M, days: 126}
footnote: "각 거래일 최종 snapshot 기준 · 저장 후 고정"
footnote_en: "Daily recorded history · past states locked"
insufficient:
  state: INSUFFICIENT_DATA
  label: "Insufficient data"
  label_ko: "데이터 부족"
#: snapshot 의 logic_version 은 이 설정 파일들의 내용 해시다 — 룰이 바뀌면 버전이 바뀐다(과거 snapshot 은 그대로).
logic_files:
  market_regime: [scoring.yaml, state_rules.yaml, factors.yaml, calendar.yaml]
  ai_sentiment: [ai_regime.yaml]
  ai_regime: [ai_regime.yaml, stock_exposures.yaml]
  rates_regime: [rates_regime.yaml, themes.yaml, scoring.yaml]
  oil_regime: [oil_regime.yaml, themes.yaml, scoring.yaml]
