# Market Pulse AI — Theme 레지스트리 (요구 5)
#
# keywords : RuleExtractor 가 뉴스 태깅에 쓴다. LLM 이 없어도 동작해야 하므로
#            한국어와 영어를 함께 둔다 (요구 15-7).
# instruments : theme -> asset 매핑. direction 이 -1 이면 역방향이다.
#            예) Inflation 테마에서 성장주(NDX)는 금리 상승에 눌리므로 -1.
#            weight 는 테마 내 상대 중요도이며 합이 1일 필요는 없다 (정규화한다).

themes:
  - id: ai
    name: AI
    aliases: [인공지능, Artificial Intelligence]
    keywords: [AI, 인공지능, LLM, 생성형, GPU, 데이터센터, OpenAI, Nvidia, 엔비디아, 추론, 학습]
    macro_factors: [Growth]
    instruments:
      - {instrument_id: SOXX, weight: 0.35, direction: 1}
      - {instrument_id: NDX,  weight: 0.30, direction: 1}
      - {instrument_id: XLK,  weight: 0.20, direction: 1}
      - {instrument_id: KRX_SEMI, weight: 0.15, direction: 1}
      # flow 자산군은 price_momentum 이 아니라 flow_momentum 으로 집계된다.
      - {instrument_id: KR_FOREIGN_NET, weight: 1.00, direction: 1}

  - id: semiconductor
    name: Semiconductor
    aliases: [반도체]
    keywords: [반도체, 메모리, HBM, D램, 파운드리, semiconductor, foundry, wafer, TSMC, 삼성전자, SK하이닉스]
    macro_factors: [Growth, China]
    instruments:
      - {instrument_id: SOXX,     weight: 0.40, direction: 1}
      - {instrument_id: KRX_SEMI, weight: 0.35, direction: 1}
      - {instrument_id: KOSPI200, weight: 0.15, direction: 1}
      - {instrument_id: NDX,      weight: 0.10, direction: 1}
      - {instrument_id: KR_FOREIGN_NET, weight: 0.60, direction: 1}
      - {instrument_id: KR_INSTITUTION_NET, weight: 0.40, direction: 1}

  - id: china
    name: China
    aliases: [중국]
    keywords: [중국, 차이나, 위안화, 인민은행, 시진핑, China, PBOC, yuan, 부동산, 헝다]
    macro_factors: [China, Growth]
    instruments:
      - {instrument_id: HSCEI,  weight: 0.40, direction: 1}
      - {instrument_id: COPPER, weight: 0.30, direction: 1}
      - {instrument_id: USDCNH, weight: 0.30, direction: -1}

  - id: oil
    name: Oil
    aliases: [유가, 원유]
    keywords: [유가, 원유, 브렌트, WTI, OPEC, 감산, 증산, oil, crude, barrel, 정유]
    macro_factors: [Inflation]
    instruments:
      - {instrument_id: BRENT, weight: 0.40, direction: 1}
      - {instrument_id: WTI,   weight: 0.35, direction: 1}
      - {instrument_id: XLE,   weight: 0.25, direction: 1}

  - id: inflation
    name: Inflation
    aliases: [인플레이션, 물가]
    keywords: [인플레이션, 물가, CPI, PCE, 소비자물가, 기대인플레이션, inflation, breakeven, 디스인플레이션]
    macro_factors: [Inflation, Rates]
    instruments:
      - {instrument_id: BE10Y,  weight: 0.35, direction: 1}
      - {instrument_id: BRENT,  weight: 0.25, direction: 1}
      - {instrument_id: COPPER, weight: 0.20, direction: 1}
      - {instrument_id: NDX,    weight: 0.20, direction: -1}   # 성장주는 인플레에 역방향

  - id: rates
    name: Rates
    aliases: [금리, 채권]
    keywords: [금리, 국채, 연준, FOMC, 기준금리, 한국은행, 금통위, rates, Fed, yield, treasury, 인상, 인하]
    macro_factors: [Rates, Liquidity]
    instruments:
      - {instrument_id: US10Y, weight: 0.35, direction: 1}
      - {instrument_id: US2Y,  weight: 0.25, direction: 1}
      - {instrument_id: KR10Y, weight: 0.20, direction: 1}
      - {instrument_id: MOVE,  weight: 0.20, direction: 1}

  - id: usd
    name: USD
    aliases: [달러, 환율]
    keywords: [달러, 환율, 원달러, 강달러, 약달러, dollar, DXY, greenback, 외환]
    macro_factors: [USD]
    instruments:
      - {instrument_id: DXY,    weight: 0.45, direction: 1}
      - {instrument_id: USDKRW, weight: 0.35, direction: 1}
      - {instrument_id: EURUSD, weight: 0.20, direction: -1}

  - id: geopolitical_risk
    name: Geopolitical Risk
    aliases: [지정학, 지정학적 리스크]
    keywords: [전쟁, 분쟁, 중동, 우크라이나, 대만, 제재, 지정학, 미사일, 공습, 봉쇄, war, conflict, sanction, geopolitical, 호르무즈, 긴장]
    # 악재가 테마를 키운다. 긴장 고조는 이 테마에 +다.
    #
    # risk 극성은 **테마의 키워드 자체가 부정 극성 단어인 경우에만** 쓴다.
    # 전쟁·분쟁·긴장·제재가 그렇다. 반대로 Inflation 의 키워드(물가, CPI)는
    # 중립 명사라서, "기대인플레이션 반등" 을 뒤집으면 오히려 틀린다.
    # 그래서 Inflation 은 directional 로 둔다.
    sentiment_polarity: risk
    macro_factors: [Volatility, Inflation]
    instruments:
      - {instrument_id: GOLD,  weight: 0.30, direction: 1}
      - {instrument_id: BRENT, weight: 0.30, direction: 1}
      - {instrument_id: VIX,   weight: 0.25, direction: 1}
      - {instrument_id: ITA,   weight: 0.15, direction: 1}

