# 한국어 부정은 표현 뒤에 온다("상승하지 않았다"). 표현 뒤 이 글자 수
# 안에서 부정어가 나오면 부호를 뒤집는다.
negation:
  window_chars: 8
  markers:
    - 않
    - 못했
    - 없
    - 아닌
    - 아니

# ──────────────────────────────────────────────────────────────
# 방향 사전 — 감성과 다른 축이다
#
# 위 감성 사전은 "호재냐 악재냐" 를 본다. 이 사전은 "그 값이 오르냐
# 내리냐" 만 본다. 둘은 독립이다.
#
#   "물가 둔화 흐름 확인"      감성 +  /  물가 방향 ↓
#   "수입 물가 부담 확대 우려"  감성 −  /  물가 방향 ↑
#
# 감성 사전이 맥락 의존이라며 일부러 뺀 표현(둔화 · 확대)이 방향으로는
# 전혀 모호하지 않다. 한 필드로 합칠 수 없다는 증거다.
#
# 감성 사전과 같은 이유로 뺀 것도 있다.
#   · "인상" / "인하" — 정책 행위지 값의 움직임이 아니다. "금리 인하 시점이
#     늦춰질 가능성" 은 인하라는 글자를 담고도 금리 상승을 뜻한다.
#     부분 문자열 매칭으로는 감당할 수 없다. LLM 레이어의 몫이다.
#
# 방향을 읽을 수 없으면 0 이다. 추측해서 채우지 않는다 — 모르는 것을
# 아는 것처럼 그리면 그 아래 연쇄가 전부 거짓이 된다 (요구 15-11).
direction:
  up:
    - 상승
    - 급등
    - 오름
    - 반등
    - 상향
    - 확대
    - 증가
