# 감성 사전 (설계서 STEP 5.6)
#
# 이 사전의 역할은 LLM 없이도 파이프라인이 완주하게 하는 것이다 (요구 15-7).
# LLM 이 붙으면 이 값은 baseline 이 되고 LLM 감성과 가중 결합된다.
#
# 수록 기준
# ---------
# 시장 맥락에서 **극성이 안정적인** 표현만 담는다. 맥락에 따라 부호가
# 뒤집히는 말은 일부러 뺐다.
#   · "둔화" — 성장 둔화는 악재, 물가 둔화는 호재다. 뺀다.
#   · "확대" — 점유율 확대는 호재, 적자 확대는 악재다. 뺀다.
#   · "증산/감산" — 유가에는 하락/상승 요인이지만 에너지주에는 반대다. 뺀다.
# 이런 맥락 의존 표현이야말로 LLM 레이어가 필요한 이유다. 사전이 애매한
# 것까지 판정하려 들면 조용히 틀린 숫자를 만든다.
#
# 극성은 "해당 테마가 강해지는 방향인가" 로 읽는다. 시장에 좋은가가 아니다.
# 유가 급등 기사는 Oil 테마에 +다. Airlines 테마에는 별도 기사로 -가 붙는다.

