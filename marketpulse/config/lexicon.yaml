# 한국어 부정은 표현 뒤에 온다("상승하지 않았다"). 표현 뒤 이 글자 수
# 안에서 부정어가 나오면 부호를 뒤집는다.
negation:
  window_chars: 8
  markers:
    - 않
    - 못했
    - 없
    - 아닌
    - 아니
