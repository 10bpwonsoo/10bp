# AI Trade Intelligence — AI 탭의 판정 규칙. 모든 임계·가중·바스켓은 여기 있다. 엔진(engines/ai_regime.py)은 숫자를 갖지 않는다.
#
# 핵심 질문: AI 트레이드 자체가 약해지는가, 아니면 broad-market risk-off 에 같이 눌리는가.
# 그래서 절대 수익이 아니라 Nasdaq 100 / S&P 500 대비 상대 수익과 상대 z 가 판정의 축이다.
# 점수는 확률이 아니라 증거 크기다. 결측은 0 이 아니라 분모에서 뺀다.

z_ref: 2.0          # 가격 증거: |z| 가 이 값이면 기여 1.0 (clip)
news_ref: 40        # 뉴스 증거: 톤 ±40 이면 기여 1.0
window: max         # 하루·5일 z 중 |z| 큰 쪽
strength_bands:
  - {min: 60, label: STRONG}
  - {min: 30, label: MODERATE}
  - {min: 0,  label: WEAK}
status: {min_score: 25}   # |driver 점수| 가 이 아래면 UNCONFIRMED

benchmarks: {primary: NDX, secondary: SPX}
windows: {d1: 1, w1: 5, m1: 21}
history_bars: 120          # 바스켓 지수·상대 지수의 z(60일 창) 를 내려면 넉넉해야 한다

