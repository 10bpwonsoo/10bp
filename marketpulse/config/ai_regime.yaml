#: AI 바스켓 — 그룹별 동일가중, 바스켓은 basket_groups 의 구성원 동일가중. 한국 종목은 자기 달력(장중값)이라 그룹 note 에 적는다.
basket_groups: [semis_compute, memory, hyperscalers, networking_infra, power_datacenter, software_app]
groups:
  - {key: semis_compute,    label: "Semiconductors / Compute",    label_ko: "반도체·컴퓨트",      benchmark: NDX, members: [NVDA, AMD, AVGO, TSM, MRVL, ARM]}
  - {key: memory,           label: "Memory",                      label_ko: "메모리",             benchmark: NDX, members: [MU, SNDK, SKHYNIX, SAMSUNG], note: "SK하이닉스·삼성전자는 한국 달력(장중값)이라 미국 종목보다 하루 앞선 봉이다"}
  - {key: hyperscalers,     label: "Hyperscalers",                label_ko: "하이퍼스케일러",     benchmark: NDX, members: [MSFT, GOOGL, AMZN, META, ORCL]}
  - {key: networking_infra, label: "Networking / Infrastructure", label_ko: "네트워킹·인프라",    benchmark: NDX, members: [ANET, VRT, DELL, SMCI, CIEN, CRDO]}
  - {key: power_datacenter, label: "Power / Data Center",         label_ko: "전력·데이터센터",    benchmark: NDX, members: [VST, CEG, GEV, ETN, NRG]}
  - {key: software_app,     label: "Software / Application",      label_ko: "소프트웨어·애플리케이션", benchmark: NDX, members: [PLTR, NOW, CRM, SNOW, DDOG, APP]}
  - {key: korea_ai,         label: "Korea AI Supply Chain",       label_ko: "국내 AI 밸류체인",   benchmark: KOSPI, members: [SKHYNIX, SAMSUNG, HANMI_SEMI, SAMSUNG_EM, HD_ELECTRIC, HYOSUNG_HEAVY, LS_ELECTRIC, NAVER], note: "바스켓에는 넣지 않는다(달력·통화가 다르다). 리더십 비교용이며 KOSPI 대비다"}

#: AI / SEMI / INFRA / SOFTWARE 밸류체인 — 10개 세그먼트. 종목은 여러 세그먼트에 속할 수 있다. exposure = AI 테마 노출 수준.
#: macro 민감도: 부호는 그 요인이 오를 때 세그먼트 가격에 주는 방향(−1 역풍). duration 이 큰 소프트웨어는 금리 −2.
value_chain:
  benchmark: NDX
  segments:
    - {key: compute,     label: "Compute / GPU",              label_ko: "컴퓨트·GPU",        members: [NVDA, AMD, AVGO, ARM],                          exposure: VERY_HIGH, macro: {rates: -1, real_yield: -1, risk: -1.5, usd: -0.5}, drivers: [gpu_demand, capex, hyperscaler_spending]}
    - {key: memory_hbm,  label: "Memory / HBM",               label_ko: "메모리·HBM",        members: [MU, SNDK, SKHYNIX, SAMSUNG],                    exposure: VERY_HIGH, macro: {rates: -0.5, real_yield: -0.5, risk: -1.5, usd: -0.5}, drivers: [gpu_demand, capex], fundamentals: [HBM3E_CONTRACT, HBM4_CONTRACT, DRAM_SPOT, DDR5_SPOT, NAND_SPOT, DXI]}
    - {key: foundry,     label: "Foundry",                    label_ko: "파운드리",          members: [TSM, GFS, UMC],                                 exposure: HIGH,      macro: {rates: -0.5, real_yield: -0.5, risk: -1, usd: -0.5}, drivers: [gpu_demand, capex]}
    - {key: equipment,   label: "Semiconductor Equipment",    label_ko: "반도체 장비",       members: [ASML, AMAT, LRCX, KLAC, TEL, HANMI_SEMI],       exposure: HIGH,      macro: {rates: -0.5, real_yield: -0.5, risk: -1.5, usd: -0.5}, drivers: [capex, gpu_demand]}
    - {key: packaging,   label: "Advanced Packaging",         label_ko: "첨단 패키징",       members: [AMKR, BESI, HANMI_SEMI, TSM],                   exposure: HIGH,      macro: {rates: -0.5, real_yield: -0.5, risk: -1.5, usd: -0.5}, drivers: [gpu_demand, capex]}
    - {key: networking,  label: "Networking",                 label_ko: "네트워킹",          members: [ANET, MRVL, AVGO, CIEN, CRDO],                  exposure: HIGH,      macro: {rates: -1, real_yield: -1, risk: -1.5, usd: -0.5}, drivers: [capex, hyperscaler_spending]}
    - {key: hyperscalers, label: "Hyperscalers / Cloud",      label_ko: "하이퍼스케일러·클라우드", members: [MSFT, AMZN, GOOGL, META, ORCL],           exposure: HIGH,      macro: {rates: -1, real_yield: -1, risk: -1, usd: -0.5}, drivers: [hyperscaler_spending, monetization, capex]}
    - {key: dc_infra,    label: "Data Center Infrastructure", label_ko: "데이터센터 인프라", members: [VRT, ETN, PWR, EQIX, DLR, DELL, SMCI],          exposure: HIGH,      macro: {rates: -1.5, real_yield: -1.5, risk: -1, usd: -0.5}, drivers: [capex, hyperscaler_spending]}
    - {key: power,       label: "Power / Cooling",            label_ko: "전력·냉각",         members: [VST, CEG, GEV, NRG, HD_ELECTRIC, HYOSUNG_HEAVY, LS_ELECTRIC, DOOSAN_ENER], exposure: MEDIUM, macro: {rates: -1, real_yield: -1, risk: -0.5, usd: -0.5}, drivers: [capex]}
    - {key: software,    label: "AI Software / Applications", label_ko: "AI 소프트웨어·앱",  members: [PLTR, NOW, CRM, SNOW, DDOG, NET, APP],          exposure: HIGH,      macro: {rates: -2, real_yield: -2, risk: -1.5, usd: -0.5}, drivers: [monetization, competition, valuation]}
  #: 밸류체인 리더십 — 1주 상대 %p 로 순위. 상위 4 = CURRENT LEADERSHIP, 하위 = LAGGING(상대 %p 가 lag 이하)
  leadership_top: 4
  lag_max_rel_pct: -1.0
  lagging_bottom: 3          # LAGGING 은 상대 %p 하위 3개(리더십 제외)
  #: 화살표 문턱 (1주 상대 %p): ↑↑ ≥ 3, ↑ ≥ 1, → , ↓ ≤ −1, ↓↓ ≤ −3
  arrow_pct: [3.0, 1.0]

#: 종목 영향도 — 네 축(THEME / FUNDAMENTAL / MARKET / MACRO)을 −2…+2 로 매기고 따로 보여준다. 단일 점수로 순위화하지 않는다.
stock_impact:
  theme: {news_ref: 40, mention_bonus: 0.5}            # 세그먼트 driver 톤 평균/news_ref → −2…+2, 기사에 직접 언급되면 |톤| 방향으로 0.5 가산
  market: {rel_pct_ref: 4.0, ret21_ref: 10.0}          # 1주 상대 %p, 1개월 수익 → 축
  macro: {z_ref: 2.0}                                   # Σ 민감도 × z / z_ref → −2…+2
  axis_bands: [1.5, 0.5]                                # |v| ≥ 1.5 → ↑↑/↓↓, ≥ 0.5 → ↑/↓, 그 아래 →
  macro_inputs: {rates: US10Y, real_yield: TIPS10Y, risk: US_HY_OAS, usd: DXY, vix: VIX}
  radar_max_per_bucket: 4

#: 기대 vs 펀더멘털 — 세그먼트별 0~100. market_pricing 은 가격·상대·breadth, fundamental 은 driver 톤·메모리 데이터·EPS. 근거가 없으면 None.
expectation_gap:
  market: {rel_z_w: 25, ret21_w: 15, breadth_w: 10, ret21_ref: 10}
  fundamental: {tone_w: 30, data_w: 20, eps_w: 20}
  gap_note: 15   # |gap| 이 이 이상이면 문장에 적는다

#: 전파 체인 — 각 단계의 상태 어휘: ACCELERATING / POSITIVE / STRONG / IMPROVING / STABLE / MIXED / DETERIORATING / UNCONFIRMED
transmission:
  bands: {strong: 40, positive: 15, stable: -15, deteriorating: -40}   # 증거 점수(−100…100) 문턱
  stages:
    - {key: narrative,   label: "AI Narrative",             source: news_tone}
    - {key: capex,       label: "Hyperscaler Capex",        source: drivers, drivers: [capex, hyperscaler_spending], segment: hyperscalers, accelerating_label: true}
    - {key: compute,     label: "GPU / Compute",            source: segment, segment: compute}
    - {key: hbm,         label: "HBM",                      source: fundamentals, ids: [HBM3E_CONTRACT, HBM4_CONTRACT], drivers: [gpu_demand]}
    - {key: commodity_memory, label: "Commodity Memory",    source: fundamentals, ids: [DRAM_SPOT, DDR5_SPOT, NAND_SPOT, DXI]}
    - {key: foundry,     label: "Foundry / Packaging",      source: segment, segment: foundry, segment2: packaging}
    - {key: equipment,   label: "Semiconductor Equipment",  source: segment, segment: equipment}
    - {key: dc_infra,    label: "Data Center Infrastructure", source: segment, segment: dc_infra, segment2: power}
    - {key: eps,         label: "EPS Revision",             source: eps}

#: 반도체 펀더멘털 확인 — 영역별 (가격 모멘텀 · 상대 강도 · breadth · 뉴스/펀더멘털 · EPS). 어휘: STRONG / LEADING / IMPROVING / MIXED / NEUTRAL / WEAK / UNCONFIRMED
semi_confirmation:
  areas:
    - {key: compute,    label: "Compute / Accelerator", segment: compute}
    - {key: hbm,        label: "Memory / HBM",          segment: memory_hbm, fundamentals: [HBM3E_CONTRACT, HBM4_CONTRACT]}
    - {key: commodity,  label: "Commodity Memory",      segment: memory_hbm, fundamentals: [DRAM_SPOT, DDR5_SPOT, NAND_SPOT, DXI], fundamentals_only: true}
    - {key: foundry,    label: "Foundry",               segment: foundry}
    - {key: packaging,  label: "Advanced Packaging",    segment: packaging}
    - {key: equipment,  label: "Equipment",             segment: equipment}
  memory_rows:
    - {id: HBM3E_CONTRACT, label: "HBM3E 계약가", structural: true}
    - {id: HBM4_CONTRACT,  label: "HBM4 계약가",  structural: true}
    - {id: DRAM_SPOT,      label: "DRAM Spot"}
    - {id: DDR5_SPOT,      label: "DDR5 Spot"}
    - {id: NAND_SPOT,      label: "NAND Spot"}
    - {id: DXI,            label: "DXI"}
  improving_pct: 1.0      # 1주 또는 1개월 변화율이 이 이상이면 IMPROVING, 이하면 DETERIORATING

#: 뉴스 → 산업 driver → 밸류체인 → 종목. driver 별로 1차/2차/인프라 노출 세그먼트.
news_impact:
  top_n: 5
  chains:
    capex:                {primary: [compute, networking], secondary: [foundry, equipment, memory_hbm], infrastructure: [dc_infra, power]}
    hyperscaler_spending: {primary: [hyperscalers, compute], secondary: [networking, equipment], infrastructure: [dc_infra, power]}
    gpu_demand:           {primary: [compute, memory_hbm], secondary: [packaging, foundry, equipment], infrastructure: [networking]}
    monetization:         {primary: [software, hyperscalers], secondary: [compute], infrastructure: []}
    competition:          {primary: [software, compute], secondary: [hyperscalers], infrastructure: []}
    regulation:           {primary: [compute, hyperscalers], secondary: [equipment, foundry], infrastructure: []}
    valuation:            {primary: [software, compute], secondary: [hyperscalers], infrastructure: []}

#: WHAT MATTERS NOW — 후보 질문. 계열이 있는 것부터 최대 5개. status: CONFIRMING / WATCH / DETERIORATING
what_matters:
  max: 5
  questions:
    - {key: capex,     text: "Hyperscaler Capex 증가율이 유지되는가",                 metric: TRANS_capex,    confirming: 15, deteriorating: -15}
    - {key: memory_spread, text: "GPU/HBM 강세가 범용 memory 로 확산되는가",           metric: TRANS_commodity_memory, confirming: 15, deteriorating: -15}
    - {key: eps_breadth, text: "Semiconductor EPS revision breadth 가 확대되는가",     metric: TRANS_eps,      confirming: 15, deteriorating: -15}
    - {key: broaden,   text: "AI rally 가 Software / Infra 까지 broaden 되는가",       metric: BROADEN,        confirming: 1.0, deteriorating: -1.0}
    - {key: rel_hold,  text: "장기금리 상승에도 AI relative strength 가 유지되는가",   metric: AI_REL_NDX_Z5,  confirming: 0.0, deteriorating: -1.0}
    - {key: breadth,   text: "AI breadth(20일선 상회)가 회복되는가",                  metric: BREADTH_CHANGE, confirming: 5, deteriorating: -10}
    - {key: hyper,     text: "하이퍼스케일러가 동반 약세에서 벗어나는가",              metric: HYPER_DOWN_1W_NEG, confirming: -2, deteriorating: -4}

#: 상대·절대 판정 임계 (z)
relative:
  flat_abs: 0.5            # |z| 가 이 아래면 '보합'
  specific_z: -1.0         # AI 가 Nasdaq 대비 이 아래로 밀리면 AI-specific
  macro_band: -0.5         # 절대 약세여도 상대 z 가 이 이상이면 '시장과 같이 눌림'
  outperform_z: 0.5

#: breadth
breadth:
  ma_short: 5
  ma_long: 20
  low_pct: 50              # 20일선 상회 비율이 이 아래면 좁다
  narrowing_drop_pts: 10   # 1주 전 대비 이만큼 빠지면 '좁아진다'
  widening_rise_pts: 10

#: 리더십 — 1주 상대 수익(벤치마크 대비 %p) 순위. 회전은 1개월 리더와 1주 리더가 다를 때
leadership:
  leader_min_rel_pct: 0.5      # 1주 상대 %p 가 이 이상이어야 '리더'
  laggard_max_rel_pct: -0.5

#: driver — 부호 = AI 바스켓 가격에 주는 방향. AI_* 는 엔진이 바스켓에서 만드는 파생 z (layer: basket)
drivers:
  macro_rates:
    label: "Macro / Rates"
    label_ko: "매크로·금리"
    headline: "MACRO / RATES"
    implication: "실질금리·달러가 AI 밸류에이션(장기 현금흐름)을 누르는 경로. AI 고유 요인이 아니다."
    evidence:
      - {id: US10Y,   sign: -1, weight: 1.0}
      - {id: TIPS10Y, sign: -1, weight: 1.2}
      - {id: DXY,     sign: -1, weight: 0.6}
      - {id: MOVE,    sign: -1, weight: 0.6}
  broad_risk_off:
    label: "Broad Risk-Off"
    label_ko: "시장 전반 위험회피"
    headline: "BROAD RISK-OFF"
    implication: "지수·신용·변동성이 같이 움직이는 국면. AI 는 베타로 눌린다 — 상대 수익이 답이다."
    evidence:
      - {id: SPX,       sign: 1,  weight: 1.0}
      - {id: RUT,       sign: 1,  weight: 0.6}
      - {id: VIX,       sign: -1, weight: 1.0}
      - {id: US_HY_OAS, sign: -1, weight: 1.2}
      - {id: XLK,       sign: 1,  weight: 0.6}
  semi_cycle:
    label: "Semiconductor Cycle"
    label_ko: "반도체 사이클"
    headline: "SEMICONDUCTOR CYCLE"
    implication: "메모리 가격·반도체 지수·장비가 이끄는 국면. AI 의 하드웨어 다리다."
    evidence:
      - {id: SOXX,       sign: 1, weight: 1.0}
      - {id: AI_SEMIS_REL, sign: 1, weight: 1.0, note: "반도체·컴퓨트 그룹의 Nasdaq 대비 상대 z"}
      - {id: AI_MEMORY_REL, sign: 1, weight: 0.8, note: "메모리 그룹의 Nasdaq 대비 상대 z"}
      - {id: DRAM_SPOT,  sign: 1, weight: 0.6}
      - {id: DXI,        sign: 1, weight: 0.6}
      - {theme: semiconductor, field: news_sentiment, sign: 1, weight: 0.6, label: "반도체 뉴스 톤"}
  ai_narrative:
    label: "AI Narrative"
    label_ko: "AI 내러티브"
    headline: "AI NARRATIVE"
    implication: "뉴스 톤이 가격을 이끄는 국면. 가격이 따라오지 않으면 분배(distribution) 위험이다."
    evidence:
      - {theme: ai, field: news_sentiment, sign: 1, weight: 1.2, label: "AI 뉴스 톤"}
      - {theme: ai, field: news_momentum,  sign: 1, weight: 0.6, label: "AI 뉴스 모멘텀(최근 − 이전)"}
      - {narrative: capex,          sign: 1, weight: 0.8}
      - {narrative: gpu_demand,     sign: 1, weight: 0.8}
      - {narrative: hyperscaler_spending, sign: 1, weight: 0.8}
  ai_fundamental_stress:
    label: "AI-specific Fundamental Stress"
    label_ko: "AI 고유 펀더멘털 스트레스"
    headline: "AI-SPECIFIC FUNDAMENTAL STRESS"
    implication: "AI 가 시장보다 더 빠진다 — 수익화·밸류에이션·경쟁 우려가 가격에 찍히는 국면. 베타가 아니라 알파의 훼손이다."
    evidence:
      - {id: AI_REL_NDX,   sign: 1, weight: 1.5, note: "AI 바스켓의 Nasdaq 대비 상대 z"}
      - {id: AI_HYPER_REL, sign: 1, weight: 1.0, note: "하이퍼스케일러 그룹의 상대 z"}
      - {id: AI_SOFT_REL,  sign: 1, weight: 0.8, note: "소프트웨어 그룹의 상대 z"}
      - {narrative: monetization, sign: 1, weight: 0.8}
      - {narrative: valuation,    sign: 1, weight: 0.6}
      - {narrative: competition,  sign: 1, weight: 0.6}
      - {narrative: regulation,   sign: 1, weight: 0.4}

#: 내러티브 driver — AI 태그 기사를 제목 키워드로 분류한다(룰 기반, LLM 아님). 한 기사가 여러 driver 에 들어갈 수 있다.
narrative_drivers:
  - {key: capex,                label: "AI Capex",              label_ko: "AI 설비투자",   keywords: [capex, 설비투자, 투자하, invest, infrastructure, 인프라, buildout, 데이터센터 건설, data center]}
  - {key: gpu_demand,           label: "GPU Demand",            label_ko: "GPU 수요",      keywords: [GPU, 가속기, accelerator, Nvidia, 엔비디아, HBM, chip demand, 반도체 수요, CPU 호황, 수요가]}
  - {key: hyperscaler_spending, label: "Hyperscaler Spending",  label_ko: "하이퍼스케일러 지출", keywords: [Microsoft, 마이크로소프트, Google, 구글, Amazon, 아마존, Meta, 메타, Oracle, 오라클, cloud, 클라우드, hyperscaler, 하이퍼스케일러]}
  - {key: monetization,         label: "Monetization",          label_ko: "수익화",        keywords: [monetiz, 수익화, revenue, 매출, subscription, 구독, agent, 에이전트, adoption, 도입, ROI]}
  - {key: competition,          label: "Competition",           label_ko: "경쟁",          keywords: [competition, 경쟁, DeepSeek, 딥시크, open-source, 오픈소스, rival, 중국 AI, China AI, price war, 가격 인하, acqui, 인수, to buy, M&A]}
  - {key: regulation,           label: "Regulation / Safety",   label_ko: "규제·안전",     keywords: [regulat, 규제, safety, 안전, antitrust, 반독점, export control, 수출 규제, 수출통제, ban, existential, 위험, lawsuit, 소송]}
  - {key: valuation,            label: "Valuation / Funding",   label_ko: "밸류에이션·자금", keywords: [valuation, 밸류에이션, bubble, 거품, IPO, 상장, 자사주, buyback, 시총, market cap, 고평가, 조달, funding, 파이낸싱, financing, PF]}

#: NARRATIVE × PRICE 2×2 — 뉴스 톤과 바스켓 절대 z 의 부호
narrative_price:
  news_on: 10        # |톤| 이 이 이상이면 방향 있음
  price_on: 0.5      # |z| 가 이 이상이면 방향 있음

#: MACRO CONFIRMATION — 기대 부호 = 그 요인이 오를 때 AI 가격에 주는 방향
macro_confirmation:
  min_explains: 2          # 이만큼 설명하면 'macro-driven'
  rows:
    - {key: rates,      label: "Rates (US 10Y)",        id: US10Y,     sign: -1}
    - {key: real_yield, label: "Real Yield (TIPS 10Y)", id: TIPS10Y,   sign: -1}
    - {key: usd,        label: "USD (DXY)",             id: DXY,       sign: -1}
    - {key: vix,        label: "VIX",                   id: VIX,       sign: -1}
    - {key: hy,         label: "HY OAS",                id: US_HY_OAS, sign: -1}
    - {key: spx,        label: "S&P 500",               id: SPX,       sign: 1}

#: AI-SPECIFIC STRESS — 항목별 점수(0/1/2) 합
stress:
  levels: [{min: 5, label: HIGH}, {min: 3, label: MODERATE}, {min: 0, label: LOW}]
  components:
    - {key: rel_ndx,     label: "AI vs Nasdaq 상대 모멘텀(5일 z)", metric: AI_REL_NDX_Z5,  thresholds: [-1.0, -0.5], direction: below}
    - {key: semi_rel,    label: "반도체 상대 강도(5일 z)",          metric: AI_SEMIS_REL_Z5, thresholds: [-1.0, -0.5], direction: below}
    - {key: hyper_breadth, label: "하이퍼스케일러 20일선 상회 비율", metric: HYPER_ABOVE_MA20, thresholds: [40, 60], direction: below}
    - {key: news,        label: "AI 뉴스 톤",                      metric: AI_NEWS_TONE,   thresholds: [-20, -5], direction: below}

#: 판정 규칙 — 엔진이 이 순서로 검사한다: ai_specific_derisking → narrative_ahead → macro_dragged → leadership_narrowing → confirmed_risk_on → confirmed_risk_off → price_resilience → mixed. 임계는 relative/breadth/narrative_price
regimes:
  ai_specific_derisking: {label: "AI-SPECIFIC DE-RISKING",     label_ko: "AI 고유 디레버리징",   implication: "AI 가 시장보다 더 빠진다 — 베타가 아니라 알파의 훼손. 하이퍼스케일러·반도체 상대 약세가 같이 나오면 포지션 축소 국면이다."}
  macro_dragged:         {label: "MACRO-DRAGGED AI WEAKNESS",  label_ko: "매크로에 눌린 AI 약세", implication: "AI 절대 가격은 빠지지만 Nasdaq 과 같이 빠진다 — 금리·달러·신용이 원인이고 AI 고유 요인이 아니다. 매크로가 풀리면 되돌아온다."}
  leadership_narrowing:  {label: "LEADERSHIP NARROWING",       label_ko: "리더십 축소",           implication: "지수는 버티는데 참여 종목이 줄어든다 — 소수 종목이 끌고 가는 랠리. 랠리 후반부 신호이며 breadth 회복 없이는 취약하다."}
  narrative_ahead:       {label: "NARRATIVE AHEAD OF PRICE",   label_ko: "내러티브가 가격을 앞선다", implication: "뉴스는 뜨거운데 가격이 따라오지 않는다 — 분배(distribution) 위험. 가격이 확인하기 전까지 뉴스를 근거로 삼지 않는다."}
  confirmed_risk_on:     {label: "CONFIRMED AI RISK-ON",       label_ko: "AI 위험선호 확인",       implication: "절대·상대 모두 오르고 breadth 가 넓다 — 트레이드가 건강하다. 뉴스와 가격이 서로 확인한다."}
  confirmed_risk_off:    {label: "CONFIRMED AI RISK-OFF",      label_ko: "AI 위험회피 확인",       implication: "뉴스와 가격이 같이 식는다 — AI 고유 요인과 매크로가 겹친 하락. 상대 z 가 회복해야 바뀐다."}
  price_resilience:      {label: "PRICE RESILIENCE",           label_ko: "가격 회복력",            implication: "뉴스는 나쁜데 가격이 버틴다 — 악재가 이미 가격에 있다는 뜻이거나, 매수 수요가 뉴스보다 강하다."}
  mixed:                 {label: "AI TRADE MIXED",             label_ko: "AI 혼조",                implication: "절대·상대·breadth·뉴스 중 어느 것도 뚜렷하지 않다. 판정을 미루고 전환 조건을 본다."}

#: WHAT CHANGES THE VIEW — AI-specific risk-off 로 판단을 바꿀 조건
triggers:
  to_ai_specific_risk_off:
    - {metric: AI_REL_NDX_Z5,    op: "<=", value: -1.0, text: "AI 바스켓이 Nasdaq 100 대비 −1σ 이상 underperform (5일 상대 z)"}
    - {metric: SEMI_ABOVE_MA20,  op: "<=", value: 30,   text: "반도체·컴퓨트 breadth(20일선 상회) 30% 이하"}
    - {metric: AI_SEMIS_REL_Z5,  op: "<=", value: -1.0, text: "반도체 / Nasdaq 상대 모멘텀 붕괴 (5일 상대 z ≤ −1)"}
    - {metric: HYPER_DOWN_1W,    op: ">=", value: 4,    text: "하이퍼스케일러 5개 중 4개 이상 1주 하락(동반 약세)"}
    - {metric: AI_NEWS_TONE,     op: "<=", value: -20,  text: "AI 내러티브 급락 (뉴스 톤 −20 이하)"}
  release:
    - {metric: AI_REL_NDX_Z5, op: ">=", value: 0.5, text: "AI 바스켓이 Nasdaq 대비 +0.5σ 이상 회복하면 AI 고유 약세 판단을 거둔다"}

#: AI TRADE REGIME 상태 띠 — 영어 상태값은 그대로 두고 그 아래 한 줄 '지금 시장에서 이 상태가 뜻하는 것'. 번역이 아니라 투자적 의미. {confirming} 은 확인 영역 이름.
status_meaning:
  narrative: {POSITIVE: "뉴스·AI 투자 스토리가 뚜렷하게 긍정적", "NEUTRAL+": "뉴스·AI 투자 스토리는 소폭 긍정", NEUTRAL: "뉴스 흐름에 뚜렷한 방향 없음", "NEUTRAL−": "뉴스·AI 투자 스토리가 소폭 부정", NEGATIVE: "뉴스·AI 투자 스토리가 부정적"}
  relative: {STRONG: "AI 가 시장 대비 상대강도 우위", RESILIENT: "절대가격은 약해도 시장 대비 상대강도는 유지", NEUTRAL: "AI 가 시장과 같은 걸음", SOFT: "AI 가 시장 대비 상대강도 약화", WEAK: "AI 가 시장보다 뚜렷하게 약함 — AI 고유 요인 의심"}
  price: {STRONG: "실제 가격이 AI 기대를 확인", FLAT: "가격은 아직 방향을 찍지 않음", WEAK: "실제 가격은 AI 기대를 충분히 확인하지 못함"}
  semi: {STRONG: "반도체 전반이 펀더멘털·가격으로 확인", PARTIAL: "{confirming}은(는) 개선되지만 반도체 전체 확산은 제한", WEAK: "반도체 펀더멘털 확인 약함", UNCONFIRMED: "확인할 반도체 데이터 부족"}
  infra: {STRONG: "AI 인프라(데이터센터·전력·네트워킹) 가격이 리더십 확인", MIXED: "AI 인프라 세그먼트 간 방향이 엇갈림", WEAK: "AI 인프라 관련 가격 confirmation 약함"}
  software: {STRONG: "소프트웨어까지 AI 랠리 확산", NEUTRAL: "뚜렷한 방향성 없음", WEAK: "소프트웨어는 AI 랠리에서 뒤처짐"}
  breadth: {WIDENING: "상승에 참여하는 종목 수가 증가", STABLE: "참여 종목 수 유지", NARROWING: "상승에 참여하는 종목 수가 감소"}
  macro: {TAILWIND: "금리·Credit 환경이 AI 자산에 우호적", NEUTRAL: "매크로가 AI 가격을 설명하지 않음", HEADWIND: "금리·Credit 환경이 AI 자산에 부담"}
  fundamental: {STRONG: "펀더멘털 개선이 value chain 전반에서 확인", PARTIAL: "펀더멘털 개선이 일부 value chain 에서만 확인", WEAK: "펀더멘털이 약해지고 있음", UNCONFIRMED: "펀더멘털을 확인할 데이터 부족"}
  missing: "데이터 없음"

#: AI REGIME READ — FUNDAMENTAL CONFIRMATION 장문 · SUMMARY · 맥락 문장을 대신하는 2~3문장. 값은 이미 있는 상태값에서만 고른다.
regime_read:
  fund: {STRONG: "AI 펀더멘털은 확인되고 있", PARTIAL: "AI 펀더멘털은 유지되고 있", WEAK: "AI 펀더멘털은 약해지고 있", UNCONFIRMED: "AI 펀더멘털은 아직 확인되지 않"}
  market: {strong: "고 가격 confirmation 과 시장 breadth 도 이를 확인합니다.", weak: "지만 가격 confirmation 과 시장 breadth 는 약합니다.", mixed: "지만 가격·breadth 의 확인은 엇갈립니다."}
  leaders: "{leaders}은(는) 상대적으로 견조하지만 "
  no_leaders: "리더십이 뚜렷한 세그먼트는 없고 "
  macro: {HEADWIND: "금리·Credit Stress 가 AI 전반의 확산을 제한하고 있습니다.", TAILWIND: "매크로 환경도 AI 확산을 받치고 있습니다.", NEUTRAL: "매크로는 방향을 정하지 않고 있습니다.", "–": "매크로 판정은 계열이 없어 비어 있습니다."}

#: AI SENTIMENT · GREED & FEAR — AI 투자 테마 내부의 투자심리와 실제 시장 확인 강도(0~100). 일반 시장 Fear & Greed 가 아니다.
#: 상승·매수 확률·수익률 전망이 아니라 Narrative + Price + Breadth + Fundamentals + Macro 를 합친 현재 상태 지표다.
#: 각 입력은 clip(값/ref) 을 0~100 으로 옮긴다(50 = 중립). 결측 입력은 분모에서 뺀다 — 0 이 아니다. 엔진(engines/ai_sentiment.py)은 숫자를 갖지 않는다.
sentiment:
  z_ref: 2.0            # z 입력: |z| = z_ref 이면 0 또는 100
  news_ref: 40          # 뉴스 톤 입력: ±40 이면 0 또는 100
  min_coverage: 0.5     # 가중치 기준 확보율이 이 아래면 INDEX 를 내지 않는다
  min_events: 3         # AI 기사가 이보다 적으면 뉴스 톤 입력은 결측
  bands:                # 위에서부터 먼저 걸리는 것
    - {min: 80, key: EXTREME_GREED, label: "EXTREME GREED", ko: "과열된 투자심리"}
    - {min: 60, key: GREED,         label: "GREED",         ko: "낙관적인 투자심리"}
    - {min: 40, key: NEUTRAL,       label: "NEUTRAL",       ko: "중립적인 투자심리"}
    - {min: 20, key: FEAR,          label: "FEAR",          ko: "불안한 투자심리"}
    - {min: 0,  key: EXTREME_FEAR,  label: "EXTREME FEAR",  ko: "극단적 공포"}
  components:
    - key: narrative
      desc_ko: 뉴스·Capex·시장 스토리
      label: NARRATIVE
      label_ko: 내러티브
      weight: 0.20
      read: {high: "AI Capex / AI 뉴스 흐름 긍정적", mid: "AI 뉴스 흐름은 중립적", low: "AI 뉴스 흐름 부정적"}
      inputs:
        - {id: ai_news_tone, label: "AI News Tone", label_ko: "AI 뉴스 톤", source: news_tone, ref: 40, weight: 1.0}
