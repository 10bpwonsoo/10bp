      meaning: {strong_neg: "AI 고유 펀더멘털 훼손이 가격에 강하게 찍힘", neg: "AI 자체 펀더멘털 약화 신호는 아직 제한적", neutral: "AI 고유 펀더멘털 스트레스 신호 없음", pos: "AI 고유 요인이 가격을 받침", strong_pos: "AI 고유 요인이 가격을 강하게 지지"}
      why: "AI 가 시장보다 약하더라도 AI-specific fundamentals 까지 악화됐는지 별도로 확인해야 합니다."
      transmission: ["수익화 · 밸류에이션 · 경쟁 우려", "하이퍼스케일러 · 소프트웨어 상대약세", "AI 바스켓의 Nasdaq 대비 추가 약세", "알파 훼손"]
      price_check: [relative]
      extra_rows: [{label: "Hyperscalers", source: group_role, key: hyperscalers}, {label: "AI Narrative", source: narrative_tone}, {label: "Semi Fundamentals", source: fc_level}]
      status_ko: {CONFIRMED: "AI 고유 펀더멘털 훼손이 가격에 확인됨", UNCONFIRMED: "AI 산업 자체의 펀더멘털 훼손 근거는 아직 부족", CONTRADICTED: "AI 고유 요인과 가격이 반대"}
      important: "AI underperformance ≠ AI fundamental deterioration — 이 둘을 구분하는 카드"

#: DRIVER VERDICT — 순위는 |score| 만이 아니라 확인 여부·데이터 확보율을 곱한 값. 지속성은 driver 이력이 없어 아직 못 쓴다(note 에 적는다).
driver_verdict:
  status_weight: {CONFIRMED: 1.0, UNCONFIRMED: 0.6, CONTRADICTED: 0.3}
  min_abs: 10               # |score| 가 이 아래면 어느 역할에도 넣지 않는다
  roles_down: {primary: "PRIMARY PRESSURE", secondary: "SECONDARY PRESSURE", offset: "OFFSETTING SUPPORT", unconfirmed: "NOT YET CONFIRMED"}
  roles_up: {primary: "PRIMARY SUPPORT", secondary: "SECONDARY SUPPORT", offset: "OFFSETTING PRESSURE", unconfirmed: "NOT YET CONFIRMED"}
  gap_label: {underperform: "AI UNDERPERFORMANCE", outperform: "AI OUTPERFORMANCE", inline: "AI IN LINE WITH MARKET", unknown: "AI vs MARKET"}
  gap_question: "AI 의 Nasdaq 대비 {gap}%p 를 어떤 driver 가 설명하고 있는가"
  macro_drivers: [macro_rates, broad_risk_off]
  conclusion:
    down_macro: "현재 AI 약세는 AI 산업 자체의 펀더멘털 훼손보다는 {primary}{secondary_clause}의 설명력이 더 큽니다."
    down_specific: "현재 AI 약세는 {primary} 등 AI 고유 요인의 설명력이 큽니다 — 베타가 아니라 알파의 훼손을 의심합니다."
    up: "현재 AI 강세는 {primary}{secondary_clause}가 주로 설명합니다."
    flat: "AI 바스켓이 방향을 찍지 않아 driver 의 설명력을 가격으로 확인하지 못합니다."
    offset: " {offset}은(는) 오히려 {dir} 압력을 일부 상쇄하고 있습니다."
    unconfirmed: " {unconfirmed}은(는) 아직 가격으로 확인되지 않았습니다."
    secondary_clause: "와(과) {secondary}"
    dir_down: "하방"
    dir_up: "상방"
  method: "순위 = |evidence score| × 확인 가중(CONFIRMED 1.0 · UNCONFIRMED 0.6 · CONTRADICTED 0.3) × 데이터 확보율. 지속성은 driver 이력이 쌓이면 반영한다."

#: AI CHAIN VIEW (2026-10-01) — TRANSMISSION · VALUE-CHAIN LEADERSHIP · SEMI CONFIRMATION 세 영역을 하나의 흐름으로 압축하는 표시 층.
#: 계산은 그대로(transmission.stages · value_chain.segments · semi_confirmation.areas · expectation_gap). 여기는 라벨·정렬·VIEW 규칙·문장뿐이다.
chain_view:
  subtitles:
    transmission: "AI 수요가 실제 산업 데이터로 어디까지 전달됐는가"
    leadership: "현재 주가가 어느 AI 밸류체인을 선호하고 있는가"
    semi: "반도체 실제 데이터가 AI 수요를 얼마나 확인하는가"
    alignment: "펀더멘털과 주가가 어디에서 일치 / 괴리되는가"
  score_tip: "Score: −100 = 강한 약화 / 0 = 중립 / +100 = 강한 개선"
  #: FUNDAMENTAL × PRICE 행 — stage(전파 단계) 와 segment(밸류체인) 를 잇는다. stage 가 없으면 expectation_gap.fundamental(0~100) 로 펀더멘털 상태를 읽는다.
  rows:
    - {key: equipment,    label: "Equipment",        stage: equipment,  segment: equipment}
    - {key: packaging,    label: "Packaging",        stage: foundry,    segment: packaging}
    - {key: hbm,          label: "HBM",              stage: hbm,        segment: memory_hbm}
    - {key: compute,      label: "GPU / Compute",    stage: compute,    segment: compute}
    - {key: hyperscalers, label: "Hyperscalers",     stage: capex,      segment: hyperscalers}
    - {key: dc_infra,     label: "DC Infra",         stage: dc_infra,   segment: dc_infra}
    - {key: foundry,      label: "Foundry",          stage: foundry,    segment: foundry}
    - {key: power,        label: "Power / Cooling",  stage: dc_infra,   segment: power}
    - {key: networking,   label: "Networking",       stage: null,       segment: networking}
    - {key: software,     label: "Software",         stage: null,       segment: software}
  main_rows: 6                       # 기본 화면에 보이는 행 수 — 나머지는 View all
  gap_fund_bands: {positive: 70, deteriorating: 40}   # stage 없는 행: expectation_gap.fundamental 문턱
  price_weak_breadth: 50             # lagging 이면서 20일선 상회 비율이 이 아래면 WEAK
  fund_good: [ACCELERATING, POSITIVE, STRONG, IMPROVING]
  fund_bad: [DETERIORATING]
  price_good: [LEADING, STRONG]
  price_bad: [LAGGING, WEAK]
  views:
    CONFIRMED: "펀더멘털과 가격이 같은 강한 방향"
    DIVERGENCE: "펀더멘털은 강하지만 가격은 아직 약함"
    FUNDAMENTAL-LED: "펀더멘털이 가격보다 먼저 개선"
    PRICE-LED: "가격이 펀더멘털보다 먼저 움직임"
    MIXED: "신호가 혼재"
    WEAK: "펀더멘털과 가격 모두 약하거나 확인 부족"
  fundamentals_label: {STRONG: "Positive", PARTIAL: "Selective Positive", WEAK: "Weak", UNCONFIRMED: "Unconfirmed"}
  fundamentals_ko: {STRONG: "전반 확산", PARTIAL: "선택적 확산", WEAK: "약화", UNCONFIRMED: "확인 데이터 부족"}
  stage_short: {narrative: "AI Narrative", capex: "Hyperscaler Capex", compute: "GPU / Compute", hbm: "HBM", commodity_memory: "Commodity Memory", foundry: "Foundry / Packaging", equipment: "Semi Equipment", dc_infra: "Data Center Infra", eps: "EPS Revision"}
  semi_columns: [{key: price_momentum, label: "PRICE"}, {key: relative_strength, label: "REL STRENGTH"}, {key: breadth, label: "BREADTH"}, {key: news_evidence, label: "NEWS / FUND"}, {key: eps, label: "EPS"}]
  semi_meaning: {confirm: "{good} 확인", weak: "{bad} 약함", none: "잴 계열 없음", eps_na: "EPS 컨센서스 없음"}
  hbm_area: hbm
  read:
    snapshot: "AI 펀더멘털은 {fund_ko}이고 현재 확인은 {confirmed}에 가장 집중"
    snapshot_none: "AI 펀더멘털은 {fund_ko}이고 펀더멘털과 가격이 함께 확인되는 밸류체인은 아직 없음"
    key_gap: "{label} fundamentals > {label} price"
    key_gap_none: "뚜렷한 괴리 없음"
    fundamental: "{good}에서 확인 강도가 높고, {mixed}는 아직 혼재."
    fundamental_none: "확인 강도가 높은 단계가 아직 없음."
    leadership: "{top} 중심의 강세. {bottom}는 상대적으로 약함."
    leadership_none: "리더십이 뚜렷한 세그먼트 없음."

#: BASKET READ · BREADTH READ (2026-10-01) — 숫자를 다시 읽지 않고 '숫자 → 시장 구조 → 투자자가 알아야 할 의미' 로. 두 화면은 각자 자기 데이터만 쓴다. 최대 3문장.
basket_read:
  true_lead_rel: 0.5          # 1주 Nasdaq 대비 %p 가 이 이상이면 TRUE LEADERSHIP(실제 outperform)
  lag_rel: -0.5               # 이 이하면 LAGGING
  broad_ma20: 60              # 20일선 상회 비율이 이 이상이면 breadth 견조
  narrow_ma20: 50             # 이 아래면 breadth 좁음
  structural_rel_1m: 0.0      # 구조적 laggard: 1주 ≤ lag_rel 이고 1개월 ≤ 이 값이고 breadth < narrow_ma20
  divergence_ma20: 70         # 가격은 약한데 20일선 위 비율이 이 이상이고 1개월 상대 > 0 이면 '중기 구조 유지'
  rotation_gap: 1.0           # rotation 조건: 새 리더 1주 상대 − 옛 리더 1주 상대 ≥ 이 값
  rotation_min_conditions: 4  # 아래 5조건 중 이만큼 이상이면 rotation, 2 이상이면 '변화 가능성', 그 아래는 언급 안 함
  rotation_possible_conditions: 2
  text:
    #: *_conj 는 뒤에 절이 이어질 때 쓰는 연결형 — 한 문장 안에 rotation·divergence 절을 넣어 전체를 3문장 안에 둔다
    big_true: "{leaders}이(가) Nasdaq 을 실제로 outperform 해 AI 내부 leadership 은 {leaders}에 있습니다."
    big_true_conj: "{leaders}이(가) Nasdaq 을 실제로 outperform 해 AI 내부 leadership 은 {leaders}에 있으며,"
    big_none: "AI 그룹 전체가 Nasdaq 을 밑돌고 있어 현재는 뚜렷한 AI leadership 국면이 아닙니다."
    big_none_conj: "AI 그룹 전체가 Nasdaq 을 밑돌고 있어 현재는 뚜렷한 AI leadership 국면이 아니며,"
    big_mixed: "AI 그룹 대부분이 Nasdaq 과 같은 걸음이거나 약해 뚜렷한 AI leadership 은 없습니다."
    big_mixed_conj: "AI 그룹 대부분이 Nasdaq 과 같은 걸음이거나 약해 뚜렷한 AI leadership 은 없으며,"
    rot_confirmed: " 상대강도의 축은 {old}에서 {new}(으)로 옮겨가고 있습니다."
    rot_possible: " {old} → {new} 순위 변동은 leadership 변화 가능성일 뿐 아직 rotation 으로 확인되지 않았습니다."
    top_true_broad: "{top}은(는) 상대강도와 breadth 가 함께 강해 추세의 질이 좋습니다."
    top_true_broad_conj: "{top}은(는) 상대강도와 breadth 가 함께 강해 추세의 질이 좋고,"
    top_true_narrow: "{top}은(는) 실제로 outperform 하지만 breadth 가 좁아 소수 종목이 끄는 상대강도입니다."
    top_true_narrow_conj: "{top}은(는) 실제로 outperform 하지만 breadth 가 좁아 소수 종목이 끄는 상대강도이고,"
    top_resilient_narrow: "{top}은(는) peer 대비 가장 선방하지만 breadth 가 좁아 강한 추세라기보다 방어적 상대강도에 가깝습니다."
    top_resilient_narrow_conj: "{top}은(는) peer 대비 가장 선방하지만 breadth 가 좁아 강한 추세라기보다 방어적 상대강도에 가깝고,"
    top_resilient_broad: "{top}은(는) peer 대비 가장 선방하고 내부 참여도도 유지돼 상대강도의 질이 나쁘지 않습니다."
    top_resilient_broad_conj: "{top}은(는) peer 대비 가장 선방하고 내부 참여도도 유지돼 상대강도의 질이 나쁘지 않으며,"
    divergence_clause: " {div}은(는) 단기 가격은 약하지만 20일선 위 종목 비율이 높아 중기 구조가 완전히 훼손된 것은 아닙니다."
    weak_structural: "{lag}은(는) 단기·중기 상대성과와 breadth 가 함께 약해 가장 구조적인 laggard 입니다."
    weak_short: "{lag}이(가) 가장 약하지만 breadth 는 유지돼 구조적 약세보다 단기 약세에 가깝습니다."
    weak_none: "구조적으로 약한 그룹은 아직 없습니다."
    empty: "그룹 상대 모멘텀을 낼 계열이 부족합니다."

breadth_read:
  selloff_max: 20             # 상승 비율·5일선 위 비율이 둘 다 이 이하면 BROAD SELL-OFF
  advance_min: 80             # 둘 다 이 이상이면 BROAD ADVANCE
  short_weak_max: 50          # 5일선 위 비율이 이 아래면 단기 과반 약화
  medium_intact_min: 50       # 20일선 위 비율이 이 이상이면 중기 과반 유지
  medium_strong_min: 75
  fast_drop: -15              # 1주 변화(%p)가 이 이하면 '이탈 속도가 빠르다'
  fast_rise: 10
  contrast_gap: 20            # 그룹 breadth 최대−최소가 이 이상일 때만 contrast 문장
  text:
    #: 단기 절은 연결형 — 중기 절과 한 문장으로 이어 "단기 … 지만, 중기 …" 꼴을 만든다
    short_selloff: "단기 매도 압력은 AI 종목 전반으로 확산됐지만,"
    short_advance: "단기 상승에 AI 종목 대부분이 참여하고 있고,"
    short_weak: "단기 모멘텀은 과반의 AI 종목에서 약화됐지만,"
    short_mixed: "단기 모멘텀은 종목별로 엇갈리고,"
    medium_intact_after_weak: "20일선 기준으로는 아직 {share} 종목이 상승 추세를 유지해 현재는 중기 붕괴보다는 급격한 단기 deterioration 에 가깝습니다."
    medium_broken_after_weak: "20일선 기준으로도 과반이 추세를 잃어 단기 충격이 중기 추세 훼손으로 번지고 있습니다."
    medium_intact_after_strong: "20일선 기준으로도 {share} 종목이 추세를 유지해 참여가 넓은 건강한 상승입니다."
    medium_broken_after_strong: "20일선 위 종목은 아직 과반에 못 미쳐 반등이 중기 추세로 확인되지 않았습니다."
    share_majority: "절반 이상의"
    share_most: "대부분의"
    contrast: "{strong}은(는) 아직 중기 breadth 가 상대적으로 견조한 반면, {weak}은(는) 내부 참여도가 크게 약해져 있습니다."
    next_fast_drop: "20DMA breadth 가 빠르게 줄고 있어 추가 하락이 이어지는지가 단기 조정과 구조적 약세를 구분할 핵심 신호입니다."
    next_fast_rise: "20DMA breadth 가 빠르게 넓어지고 있어 이 확산이 이어지는지가 추세 확인의 핵심 신호입니다."
    next_hold: "20DMA breadth 가 과반을 지키는지가 다음 핵심 확인 포인트입니다."
    next_recover: "20DMA breadth 가 과반을 회복하는지가 다음 핵심 확인 포인트입니다."
    empty: "breadth 를 낼 구성원이 부족합니다."
