# 메모리 가격 과거 DB(2026-10-23) — data/memory_history/ 에 RAW 관측을 쌓는다(일별 state · premium 은 엔진이 만든다).
#   DRAMeXchange Daily Express(매 거래일 공개 시황) · TrendForce 주간 'Memory Spot Price Update'(공개 기사, 512Gb TLC 웨이퍼 포함)
#   · Internet Archive 에 보존된 공개 가격 페이지(DRAMeXchange 홈 · TrendForce price 페이지 — 그 당시 화면에 표시된 값만, 유료 다운로드·회원 페이지·로그인 없음).
# 키·비밀 없음. 같은 (관측일, source) 행은 다시 쓰지 않는다(append-only).
# 평일 04:10 UTC(12:10 KST) — DRAMeXchange 전날 시황 · TrendForce 수요일 기사 뒤. 이 브랜치에 수집 코드가 바뀌어 push 되면 한 번 돈다(처음 1년치 채우기).
name: collect-memory-history

on:
  schedule:
    - cron: "10 4 * * 1-5"
  workflow_dispatch:
  push:
    branches: [claude/market-pulse-ai-design-r7pmsm]
    paths:
      - .github/workflows/collect-memory-history.yml
      - marketpulse/scripts/collect_memory_history.py
      - marketpulse/adapters/alternative/memory_history.py

permissions:
  contents: write

concurrency:
  group: collect-memory-history
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: python -m pip install -e . --quiet
      - name: Daily Express (new posts)
        run: python -m marketpulse.scripts.collect_memory_history daily-express --latest
      - name: TrendForce weekly articles (since 2025-08)
        run: python -m marketpulse.scripts.collect_memory_history trendforce-weekly --since 2025-08-01
      # Internet Archive 응답이 느려 대상마다 단계를 나누고 시간 제한을 둔다. 5개마다 저장하므로 끊겨도 받은 만큼은 커밋된다(이미 읽은 보존본은 다시 받지 않는다).
      - name: Internet Archive — DRAMeXchange public home
        continue-on-error: true
        timeout-minutes: 25
        run: python -m marketpulse.scripts.collect_memory_history archived-snapshots --since 2025-07-01 --target 0
      - name: Internet Archive — TrendForce DRAM spot page
        continue-on-error: true
        timeout-minutes: 10
        run: python -m marketpulse.scripts.collect_memory_history archived-snapshots --since 2025-07-01 --target 1
      - name: Internet Archive — TrendForce wafer spot page
        continue-on-error: true
        timeout-minutes: 15
        run: python -m marketpulse.scripts.collect_memory_history archived-snapshots --since 2025-07-01 --target 2
      - name: Internet Archive — TrendForce price index page
        continue-on-error: true
        timeout-minutes: 15
        run: python -m marketpulse.scripts.collect_memory_history archived-snapshots --since 2025-07-01 --target 3
      - name: Validate
        run: python -m marketpulse.scripts.collect_memory_history validate
      # 검증 보고가 실패해도 이미 읽은 원천 행(append-only)은 남긴다 — 취소된 실행만 커밋하지 않는다
      - name: Commit CSV changes
        if: ${{ !cancelled() }}
        run: |
          git config user.name "marketpulse-collector"
          git config user.email "marketpulse-collector@users.noreply.github.com"
          git add marketpulse/data/memory_history
          if git diff --cached --quiet; then
            echo "no new rows"
          else
            git commit -m "data: memory price history $(date -u +%F)"
            for i in 1 2 3; do git pull --rebase --quiet && git push && break; sleep 5; done
          fi
