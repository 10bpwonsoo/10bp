# 메모리 가격 일일 수집 — DRAMeXchange 현물(DRAM · DDR5 · NAND · DXI)과 Silicon Analysts HBM 계약가 앵커를
# marketpulse/data/replay/alternative/*.csv 에 하루 한 줄씩 쌓는다. 키·비밀 없음(공개 페이지 · 무료 익명 API).
# DRAMeXchange 는 공개 이력이 없어 이렇게 쌓아야 Commodity Memory 의 변화율·z(20봉)가 생긴다.
# 수집 시각: DRAMeXchange 갱신(11:00 GMT+8) 뒤인 03:40 UTC(12:40 KST). 같은 날 다시 돌리면 그 날 줄을 덮어쓴다.
name: collect-memory-prices

on:
  schedule:
    - cron: "40 3 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-memory-prices
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: python -m pip install -e . --quiet
      - name: Collect today's rows
        run: python -m marketpulse.scripts.collect_memory_prices
      - name: Commit CSV changes
        run: |
          git config user.name "marketpulse-collector"
          git config user.email "marketpulse-collector@users.noreply.github.com"
          git add marketpulse/data/replay/alternative/*.csv
          if git diff --cached --quiet; then
            echo "no new rows"
          else
            git commit -m "data: memory prices $(date -u +%F)"
            git push
          fi
