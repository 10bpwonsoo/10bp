# Daily Full Dashboard Archive — 매일 아침 그날 대시보드 화면 전체를 marketpulse/data/archive/YYYY/MM/YYYY-MM-DD.json 으로 저장한다.
# 저장 시각은 config/archive.yaml 의 archive_time(07:30 Asia/Seoul)이다. cron 은 UTC 라 그 5분 뒤 07:35 KST = 전날 22:35 UTC(일~목 → 한국 월~금).
# 시각을 바꾸면 이 cron 도 같이 바꾼다 — 실행 자체는 `capture --if-due` 가 설정 시각·주말·기존 저장본을 다시 확인하므로 일찍 돌아도 저장하지 않는다.
# 같은 날짜 저장본이 이미 있으면 덮어쓰지 않는다. GitHub 의 schedule 은 기본 브랜치에서만 돈다.
name: daily-archive

on:
  schedule:
    - cron: "35 22 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MARKETPULSE_DATA_MODE: DELAYED
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      MARKETPULSE_ANTHROPIC_API_KEY: ${{ secrets.MARKETPULSE_ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: python -m pip install -e . --quiet
      - name: Capture today's dashboard archive
        run: python -m marketpulse.archive capture --if-due
      - name: Commit archive
        run: |
          git config user.name "marketpulse-archiver"
          git config user.email "marketpulse-archiver@users.noreply.github.com"
          git add marketpulse/data/archive marketpulse/data/history
          if git diff --cached --quiet; then
            echo "no new archive"
          else
            git commit -m "data: dashboard archive $(TZ=Asia/Seoul date +%F)"
            git push
          fi
