# 조사용(2026-10-23) — DRAMeXchange 공식 Historical Price Chart(chart.dramexchange.com)가 제품별로 얼마나 과거까지 나오는지 확인한다.
# Claude 세션의 네트워크 정책이 이 호스트를 막고 있어 러너에서 확인한다. 결과는 로그에만 출력하고 아무것도 커밋하지 않는다. 조사가 끝나면 지운다.
name: probe-memory-history
on:
  push:
    branches: [claude/market-pulse-ai-design-r7pmsm]
    paths: [.github/workflows/probe-memory-history.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: probe chart.dramexchange.com
        shell: bash
        run: |
          set +e
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          mkdir -p /tmp/p
          fetch() {  # $1 = name, $2 = query
            f="/tmp/p/$1.html"
            code=$(curl -sS -L -m 60 -A "$UA" -e "https://www.dramexchange.com/" -o "$f" -w "%{http_code} %{content_type}" "https://chart.dramexchange.com/chart.php?$2")
            echo "== $1 [$2] -> $code size=$(wc -c < "$f")"
            python3 - "$f" <<'PY'
          import re, sys
          t = open(sys.argv[1], encoding="utf-8", errors="ignore").read()
          dates = re.findall(r"20\d\d[-/.]\d{1,2}[-/.]\d{1,2}", t)
          print("  dates:", len(dates), "first:", dates[:3], "last:", dates[-3:])
          srcs = sorted(set(re.findall(r'(?:src|href|url)\s*[=:]\s*["\']([^"\']+)["\']', t)))
          print("  refs:", [s for s in srcs if not s.startswith("data:")][:15])
          body = re.sub(r"\s+", " ", t)
          i = max(body.find("data"), 0)
          print("  head:", body[:700])
          for m in list(re.finditer(r"(\[\s*\[?[^\]]{0,40}20\d\d[^\]]{0,200}\])", body))[:2]:
              print("  arr:", m.group(1)[:300])
          PY
          }
          curl -sS -L -m 60 -A "$UA" -e "https://www.dramexchange.com/" "https://chart.dramexchange.com/chart.php?class=spot&item=dram&type=475&days=400" -o /tmp/p/a.html
          python3 -c "import re,html;t=open('/tmp/p/a.html',encoding='utf-8',errors='ignore').read();t=re.sub(r'<script.*?</script>|<style.*?</style>','',t,flags=re.S|re.I);print('TEXT:',' '.join(html.unescape(re.sub(r'<[^>]+>',' ',t)).split())[:2000])"
          grep -oiE '<(form|iframe|img)[^>]*>' /tmp/p/a.html | head -10
          for u in js/Calendar.js; do :; done
          curl -sS -L -m 60 -A "$UA" -e "https://chart.dramexchange.com/" "https://chart.dramexchange.com/chart.php?class=spot&item=dram&type=475&days=400&from=2025-09-01" | wc -c
