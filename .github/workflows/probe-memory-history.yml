# 조사용(2026-10-23) — 메모리 가격 과거 데이터(TrendForce / DRAMeXchange)가 공개 페이지에서 얼마나 과거까지 나오는지 확인한다.
# Claude 세션의 네트워크 정책이 trendforce.com 을 막고 있어 러너에서 확인한다. 결과는 로그에만 출력하고 아무것도 커밋하지 않는다.
# 조사가 끝나면 지운다.
name: probe-memory-history
on:
  push:
    branches: [claude/market-pulse-ai-design-r7pmsm]
    paths: [.github/workflows/probe-memory-history.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: probe pages
        shell: bash
        run: |
          set +e
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          summarize() {  # $1 = file
            echo "  size=$(wc -c < "$1")"
            grep -oE 'Last Update[^<]{0,40}' "$1" | head -3 | sed 's/^/  stamp: /'
            grep -oE '[?&]page=[0-9]+' "$1" | sort -t= -k2 -n -u | tail -3 | sed 's/^/  pager: /'
            grep -oiE '(login|sign in|member)[^<]{0,30}' "$1" | head -2 | sed 's/^/  auth: /'
            python3 - "$1" <<'PY'
          import re, sys, html
          t = open(sys.argv[1], encoding="utf-8", errors="ignore").read()
          rows = re.findall(r"<tr[^>]*>(.*?)</tr>", t, re.S)
          out = []
          for r in rows:
              cells = [html.unescape(re.sub(r"<[^>]+>", " ", c)).split() for c in re.findall(r"<t[dh][^>]*>(.*?)</t[dh]>", r, re.S)]
              cells = [" ".join(c) for c in cells if c]
              if cells and any(re.search(r"\d", c) for c in cells):
                  out.append(" | ".join(cells)[:160])
          for line in out[:14]:
              print("  row:", line)
          links = sorted(set(re.findall(r'href="([^"]*(?:history|History|chart|Chart|page=)[^"]*)"', t)))[:12]
          for l in links:
              print("  link:", l)
          PY
          }
          fetch() {  # $1 = url
            f=$(mktemp)
            code=$(curl -sS -L -m 40 -A "$UA" -o "$f" -w "%{http_code}" "$1")
            echo "== $1 -> HTTP $code"
            summarize "$f"
          }
          for kind in dram_spot module_spot flash_spot wafer_spot dram_contract module_contract flash_contract; do
            for p in 1 2 10 60 260; do fetch "https://www.trendforce.com/price/dram/$kind?page=$p"; done
          done
          for p in 1 2 60; do fetch "https://www.trendforce.com/price/flash/flash_spot?page=$p"; fetch "https://www.trendforce.com/price/flash/wafer_spot?page=$p"; fetch "https://www.trendforce.com/price/flash/flash_contract?page=$p"; done
          fetch "https://www.trendforce.com/price"
          echo "== DNS chart.dramexchange.com"; getent hosts chart.dramexchange.com || echo "  no DNS"
          fetch "https://www.dramexchange.com/"
          fetch "https://www.dramexchange.com/Price/Dram_Spot"
