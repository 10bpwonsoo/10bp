# 조사용(2026-10-23) — TrendForce 주간 'Memory Spot Price Update' 기사(공개)를 목록 페이지로 찾아 2025-08 이후 몇 편이고 제품별 가격 문장이 몇 개인지 센다.
# Claude 세션의 네트워크 정책이 trendforce.com 을 막고 있어 러너에서 확인한다. 결과는 로그에만 출력하고 아무것도 커밋하지 않는다. 조사가 끝나면 지운다.
name: probe-memory-history
on:
  push:
    branches: [claude/market-pulse-ai-design-r7pmsm]
    paths: [.github/workflows/probe-memory-history.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: enumerate TrendForce weekly spot articles
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          import html, re, time, urllib.request
          UA = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36", "Accept-Language": "en"}
          def get(u):
              try:
                  with urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=60) as r:
                      return r.status, r.read().decode("utf-8", "ignore")
              except Exception as e:
                  return getattr(e, "code", 0), ""
          rx = re.compile(r'https://www\.trendforce\.com/news/(20\d\d)/(\d\d)/(\d\d)/insights-memory-spot-price-update[^"\'#? ]*')
          links = {}
          cands = [f"https://www.trendforce.com/news/?s=Memory+Spot+Price+Update&paged={p}" for p in range(1, 8)]
          cands += [f"https://www.trendforce.com/news/page/{p}/?s=insights+memory+spot+price+update" for p in range(1, 8)]
          cands += [f"https://www.trendforce.com/news/tag/{t}/page/{p}/" for t in ("spot-price", "dram-spot-price", "memory-spot-price-update", "ddr4", "nand-flash") for p in range(1, 13)]
          for u in cands:
              st, b = get(u)
              found = {m.group(0).rstrip("/") + "/" for m in rx.finditer(b)}
              new = found - set(links)
              for l in found: links[l] = 1
              print(f"list {st} +{len(new):3d} total {len(links):3d} {u}")
              time.sleep(0.5)
          arts = sorted(l for l in links if rx.match(l) and rx.match(l).group(1) + rx.match(l).group(2) >= "202508")
          print("ARTICLES since 2025-08:", len(arts), arts[:1], arts[-1:])
          keys = {"DDR4_8G": r"DDR4 1Gx8|mainstream chips", "DDR4_16G": r"16Gb", "DDR5_16G": r"DDR5", "NAND_512": r"512Gb TLC", "NAND_256": r"256Gb TLC", "NAND_128": r"128Gb TLC"}
          cnt = {k: 0 for k in keys}
          for l in arts:
              st, b = get(l)
              txt = " ".join(html.unescape(re.sub(r"<[^>]+>", " ", re.sub(r"<script.*?</script>|<style.*?</style>", "", b, flags=re.S))).split())
              sents = [s for s in re.split(r"(?<=[.])\s+", txt) if "US$" in s or "USD" in s]
              for k, kr in keys.items():
                  if any(re.search(kr, s) for s in sents): cnt[k] += 1
              print(f"## {st} {l[31:]}")
              for s in sents[:5]: print("   ", s[:240])
              time.sleep(0.5)
          print("COUNTS", cnt)
          PY
