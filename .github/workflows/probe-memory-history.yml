# 조사용(2026-10-23) — TrendForce 주간 'Memory Spot Price Update' 기사(공개)가 2025-08 이후 몇 편이고, 제품별 가격 문장이 몇 개인지 센다.
# Claude 세션의 네트워크 정책이 trendforce.com 을 막고 있어 러너에서 확인한다. 결과는 로그에만 출력하고 아무것도 커밋하지 않는다. 조사가 끝나면 지운다.
name: probe-memory-history
on:
  push:
    branches: [claude/market-pulse-ai-design-r7pmsm]
    paths: [.github/workflows/probe-memory-history.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: enumerate TrendForce weekly spot articles
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          import html, json, re, time, urllib.parse, urllib.request
          UA = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"}
          def get(u):
              try:
                  with urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=60) as r:
                      return r.status, r.read().decode("utf-8", "ignore")
              except Exception as e:
                  return getattr(e, "code", 0), str(e)
          posts = []
          for page in range(1, 6):
              q = urllib.parse.urlencode({"search": "Memory Spot Price Update", "per_page": 100, "page": page, "after": "2025-07-01T00:00:00", "_fields": "id,date,link,title,content"})
              st, body = get(f"https://www.trendforce.com/news/wp-json/wp/v2/posts?{q}")
              print("page", page, "HTTP", st, "len", len(body))
              if st != 200:
                  print(body[:300]); break
              rows = json.loads(body)
              if not rows: break
              posts += rows
              time.sleep(1)
          posts = [p for p in posts if "spot price update" in html.unescape(p["title"]["rendered"]).lower()]
          posts.sort(key=lambda p: p["date"])
          print("ARTICLES", len(posts), posts[0]["date"] if posts else None, posts[-1]["date"] if posts else None)
          keys = {"DDR4_8G": r"DDR4 1Gx8|DDR4 8Gb|mainstream chips", "DDR4_16G": r"DDR4 16Gb|2Gx8", "DDR5_16G": r"DDR5 16Gb|DDR5", "NAND_512": r"512Gb TLC", "NAND_256": r"256Gb TLC"}
          cnt = {k: 0 for k in keys}
          for p in posts:
              txt = " ".join(html.unescape(re.sub(r"<[^>]+>", " ", p["content"]["rendered"])).split())
              sents = [s for s in re.split(r"(?<=[.])\s+", txt) if "US$" in s]
              hit = {k for k, rx in keys.items() if any(re.search(rx, s) for s in sents)}
              for k in hit: cnt[k] += 1
              print(f"## {p['date'][:10]} {p['link']}")
              for s in sents[:4]:
                  print("   ", s[:260])
          print("COUNTS", json.dumps(cnt))
          PY
