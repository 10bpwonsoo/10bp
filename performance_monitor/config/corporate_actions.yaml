# 기업행위(CA) 수기 반영 내역
#
# 출처: Function_calculation_return_contribution_ver2.ipynb CELL 30~36
# 노트북에서는 매 건마다 셀을 복사해 수기로 수정했다. 값은 원본 그대로이며,
# `enabled: false` 는 원본에서 raw 셀(미실행) 상태였음을 뜻한다.
#
# 처리 로직은 src/corporate_actions.py 가 노트북 셀과 동일한 순서로 수행한다.

# 1. 인적분할 (spin-off)
#    거래정지 마지막날 total weight 를 분할비율로 나누고,
#    평가가격 대비 상장일 종가로 수익률을 보정한다.
spin_offs:
