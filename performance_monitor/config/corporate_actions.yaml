    enabled: false            # 원본 CELL 30 = raw
    last_susp_date: "2026-08-24"
    new_list_date: "2026-08-25"
    old_code: "A000880"
    new_code: "A0220W0"
    old_susp_price: 83800
    new_susp_price: 17040
    old_close_price: 118100
    new_close_price: 10010
    ratio_old: 0.7563533
