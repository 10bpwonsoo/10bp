    enabled: false            # 원본 CELL 36 = raw
    date: "2025-03-10"
    item: "A001570"
  - name: "동국제강(동국홀딩스) 편출"
    enabled: false            # 원본 CELL 38 = 전체 주석
    date: "2023-06-21"
    item: "A001230"

# 3. active weight 수기 조정
#    출처: CELL 45 (raw). BM 편입 전날 포지션 인식 오류 보정.
active_weight_overrides:
  - name: "삼성바이오로직스 2025-11-21 _next active weight 보정"
    enabled: false            # 원본 CELL 45 = raw
    date: "2025-11-21"
