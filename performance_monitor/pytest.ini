[pytest]
testpaths = tests
addopts = -q --no-header

# pandas 버전별 FutureWarning 억제.
#
# 아래 두 경고는 **원본 notebook 표현식을 그대로 옮긴 코드**에서 난다.
#   - utils.stack_dropna     : notebook 의 .stack() (pandas<2.1 의 dropna 동작에 의존)
#   - performance.compute_betalog : 원본 CELL 40 의 betalog_final.fillna(0)
#
# pandas 1.5.3 / 2.3.3 / 3.0.5 세 버전에서 테스트 48건이 모두 통과해
# 결과값이 동일함을 확인했으므로, 값에 영향이 없는 경고만 숨긴다.
# 계산 결과를 바꾸는 경고는 숨기지 않는다.
filterwarnings =
    ignore:The previous implementation of stack is deprecated:FutureWarning
    ignore:Downcasting object dtype arrays on .fillna:FutureWarning
